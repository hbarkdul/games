<svg class="bg" aria-hidden="true"><defs><pattern id="sg" width="44" height="22" patternUnits="userSpaceOnUse"><g fill="var(--bg)" stroke="currentColor" stroke-width="1.2"><g id="sc"><circle cx="0" cy="11" r="22"/><circle cx="0" cy="11" r="16.5"/><circle cx="0" cy="11" r="11"/><circle cx="0" cy="11" r="5.5"/></g><use href="#sc" x="44"/><use href="#sc" x="22" y="11"/></g></pattern><pattern id="kb" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="20" height="60" fill="#d4112e"/><rect x="20" width="20" height="60" fill="#f2c200"/><rect x="40" width="20" height="60" fill="#151010"/></pattern><pattern id="ur" width="36" height="31" patternUnits="userSpaceOnUse"><path d="M0 31L18 0L36 31ZM-18 0L0 31M36 31L54 0" fill="none" stroke="currentColor" stroke-width="1.4"/></pattern><pattern id="rp" width="70" height="70" patternUnits="userSpaceOnUse"><g fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="20" cy="20" r="6"/><circle cx="20" cy="20" r="13"/><circle cx="20" cy="20" r="20"/><circle cx="52" cy="52" r="5"/><circle cx="52" cy="52" r="11"/></g></pattern><g id="kk" fill="none" stroke="currentColor" stroke-width="1.1"><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(0)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(30)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(60)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(90)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(120)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(150)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(180)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(210)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(240)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(270)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(300)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(330)"/></g><pattern id="ki" width="56" height="56" patternUnits="userSpaceOnUse"><use href="#kk" x="14" y="14"/><use href="#kk" transform="translate(42 42) scale(.7)"/></pattern><pattern id="fx" width="48" height="48" patternUnits="userSpaceOnUse"><g fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 5C18 12 19 19 12 26C5 19 6 12 12 5Z"/><path d="M36 26C42 33 43 40 36 47C29 40 30 33 36 26Z"/><path d="M12 14C14 17 14 20 12 22"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#sg)"/></svg>

<script>
const $=s=>document.querySelector(s),W=360,H=600,cv=$('#cv'),g=cv.getContext('2d');cv.width=W;cv.height=H;
const MAPS=[
['111111111','122222221','123333321','122222221','111111111'],
['....1....','...111...','..12221..','.1222221.','123333321','111111111'],
['333333333','.2.....2.','222222222','.1.....1.','.1.....1.','.1.....1.'],
['1.2.3.2.1','.2.3.3.2.','1.2.3.2.1','.2.2.2.2.','1.1.1.1.1'],
['..22.22..','.2332332.','233.1.332','.2332332.','..22.22..']];
const PU={m:['多','Multi-ball'],w:['広','Wide paddle'],s:['遅','Slow ball'],f:['火','Fireball'],l:['雷','Laser'],c:['粘','Catch'],h:['命','Extra life']},BAG='mmwwwssffllcch';
const TH=[['light','Woodblock 浮世絵','#e6e0cf'],['dark','Neon ネオン','#0b0820'],['samurai','Samurai 侍','#0e0d0d'],['ninja','Ninja 忍','#090d0a'],['geisha','Geisha 芸者','#efd5d6'],['kabuki','Kabuki 歌舞伎','#f6e6b0'],['dragon','Dragon 龍','#1a0606'],['koi','Koi 鯉','#150e0a'],['imperial','Imperial 皇室','#ede6f5'],['kitsune','Kitsune 狐','#05061a']];
let UIF='"Zen Kaku Gothic New",sans-serif',st='menu',prev='play',lv=1,sc=0,lives=3,combo=1,P,balls=[],bricks=[],pups=[],las=[],parts=[],eff={},ban=null,tx=W/2,hi=0,last=0,cd=0,pal={},keys={};
try{hi=+localStorage.getItem('bb-hi')||0}catch(e){}
const BW=W/9,BH=20,TOP=64,spd=()=>(300+Math.min(lv,20)*18)*(eff.s>0?.65:1),rnd=(a,b)=>a+Math.random()*(b-a);
const nb=()=>({x:P.x,y:P.y-9,vx:0,vy:0,r:7,st:1,o:0});

function load(l){
  bricks=[];MAPS[(l-1)%5].forEach((row,r)=>[...row].forEach((ch,c)=>{
    if(ch!='.'){const hp=Math.min(3,+ch+((l>5&&r%2)?1:0));bricks.push({x:c*BW+1,y:TOP+r*(BH+3),w:BW-2,h:BH,hp,m:hp,f:0})}
  }));
  pups=[];las=[];parts=[];eff={w:0,s:0,f:0,l:0,c:0};P={x:W/2,w:70,y:H-44,h:12};tx=W/2;balls=[nb()];combo=1;st='ready';
}
function launch(){
  let any=false;balls.forEach(b=>{if(b.st){b.st=0;any=true;const a=rnd(-.35,.35);b.vx=Math.sin(a)*spd();b.vy=-Math.cos(a)*spd()}});
  if(any&&st=='ready')st='play';
}
function hurt(k,d){
  k.hp-=d;k.f=.12;
  if(k.hp>0){sc+=5*combo;return}
  bricks.splice(bricks.indexOf(k),1);sc+=10*k.m*combo;combo=Math.min(8,combo+1);
  for(let i=0;i<7;i++)parts.push({x:k.x+k.w/2,y:k.y+k.h/2,vx:rnd(-120,120),vy:rnd(-170,40),t:rnd(.4,.8),c:k.m});
  if(Math.random()<.17)pups.push({x:k.x+k.w/2,y:k.y+k.h,t:BAG[Math.random()*BAG.length|0]});
}
function power(t){
  sc+=50;
  if(t=='h')lives=Math.min(5,lives+1);
  else if(t=='m'){for(const b of balls.slice()){if(b.st||balls.length>=8)continue;const s=Math.hypot(b.vx,b.vy);for(const d of[-.4,.4]){const a=Math.atan2(b.vx,-b.vy)+d;balls.push({x:b.x,y:b.y,vx:Math.sin(a)*s,vy:-Math.cos(a)*s,r:7,st:0,o:0})}}}
  else eff[t]={w:12,s:10,f:8,l:10,c:12}[t];
  ban={t:1,s:PU[t][1]};
}
function end(){
  const nw=sc>hi;if(nw){hi=sc;try{localStorage.setItem('bb-hi',hi)}catch(e){}}
  st='over';ui(`<h1>終</h1><p>Score <b>${sc}</b> · Level ${lv}</p><p>${nw?'New best!':'Best '+hi}</p><button class="btn go" data-a="play">Play again</button><button class="btn" data-a="menu">Menu</button>`);
}
function upd(dt){
  for(const k in eff)eff[k]=Math.max(0,eff[k]-dt);
  P.w+=((eff.w>0?112:70)-P.w)*Math.min(1,dt*10);
  if(keys.l)tx-=430*dt;if(keys.r)tx+=430*dt;
  tx=Math.max(P.w/2,Math.min(W-P.w/2,tx));P.x+=(tx-P.x)*Math.min(1,dt*20);
  if(ban){ban.t-=dt;if(ban.t<=0)ban=null}
  bricks.forEach(k=>{if(k.f>0)k.f-=dt});
  for(const b of balls){
    if(b.st){b.x=P.x+b.o;b.y=P.y-9;continue}
    const s=Math.hypot(b.vx,b.vy)||1,k=spd()/s;b.vx*=k;b.vy*=k;
    if(Math.abs(b.vy)<spd()*.25)b.vy=(b.vy<0?-1:1)*spd()*.25;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}
    if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}
    if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}
    if(b.vy>0&&b.y+b.r>=P.y&&b.y-b.r<=P.y+P.h&&Math.abs(b.x-P.x)<=P.w/2+b.r){
      const h=Math.max(-1,Math.min(1,(b.x-P.x)/(P.w/2))),a=h*1.1,sp=spd();
      b.vx=Math.sin(a)*sp;b.vy=-Math.cos(a)*sp;b.y=P.y-b.r;combo=1;
      if(eff.c>0){b.st=1;b.o=b.x-P.x}
    }
    for(let i=bricks.length-1;i>=0;i--){
      const k=bricks[i],cx=Math.max(k.x,Math.min(b.x,k.x+k.w)),cy=Math.max(k.y,Math.min(b.y,k.y+k.h)),dx=b.x-cx,dy=b.y-cy;
      if(dx*dx+dy*dy>=b.r*b.r)continue;
      hurt(k,1);
      if(eff.f<=0){
        if(!dx&&!dy)b.vy=-b.vy;
        else if(Math.abs(dx)>Math.abs(dy))b.vx=dx>0?Math.abs(b.vx):-Math.abs(b.vx);
        else b.vy=dy>0?Math.abs(b.vy):-Math.abs(b.vy);
        break;
      }
    }
  }
  balls=balls.filter(b=>b.y<H+20);
  cd-=dt;
  if(eff.l>0&&st=='play'&&cd<=0){las.push({x:P.x-P.w/2+6,y:P.y},{x:P.x+P.w/2-6,y:P.y});cd=.28}
  for(const l of las){
    l.y-=560*dt;
    for(const k of bricks)if(l.x>k.x&&l.x<k.x+k.w&&l.y>k.y&&l.y<k.y+k.h){hurt(k,1);l.y=-99;break}
  }
  las=las.filter(l=>l.y>0);
  for(const p of pups){p.y+=150*dt;if(p.y>P.y-4&&p.y<P.y+P.h+14&&Math.abs(p.x-P.x)<P.w/2+15){power(p.t);p.y=H+99}}
  pups=pups.filter(p=>p.y<H+20);
  for(const p of parts){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt}
  parts=parts.filter(p=>p.t>0);
  if(!bricks.length){sc+=100*lives;lv++;load(lv);ban={t:1.6,s:'Level '+lv}}
  else if(!balls.length){
    lives--;combo=1;eff={w:0,s:0,f:0,l:0,c:0};pups=[];las=[];
    if(lives<=0)return end();
    balls=[nb()];st='ready';
  }
}
const rr=(x,y,w,h,r)=>{g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)};
function draw(){
  g.clearRect(0,0,W,H);g.lineWidth=1.5;
  for(const k of bricks){
    const c=pal.b[k.hp-1];g.shadowBlur=pal.gl;g.shadowColor=c;g.fillStyle=c;rr(k.x,k.y,k.w,k.h,4);g.fill();g.shadowBlur=0;
    g.strokeStyle=pal.edge;g.globalAlpha=.5;g.stroke();
    if(k.f>0){g.fillStyle='#fff';g.globalAlpha=.6;g.fill()}
    g.globalAlpha=1;
  }
  if(P){
    g.shadowBlur=pal.gl;g.shadowColor=pal.acc;g.fillStyle=pal.acc;rr(P.x-P.w/2,P.y,P.w,P.h,6);g.fill();g.shadowBlur=0;
    g.strokeStyle=pal.edge;rr(P.x-P.w/2,P.y,P.w,P.h,6);g.stroke();
    if(eff.l>0){g.fillStyle=pal.ink;g.fillRect(P.x-P.w/2+4,P.y-5,5,6);g.fillRect(P.x+P.w/2-9,P.y-5,5,6)}
  }
  for(const b of balls){g.shadowBlur=eff.f>0?16:pal.gl;g.shadowColor=eff.f>0?'#ff7a1a':pal.ink;g.fillStyle=eff.f>0?'#ff7a1a':pal.ink;g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill()}
  g.shadowBlur=0;
  g.font='800 16px '+pal.disp;g.textAlign='center';g.textBaseline='middle';
  for(const p of pups){g.fillStyle=pal.face;g.strokeStyle=pal.acc;g.lineWidth=2;rr(p.x-15,p.y-11,30,22,6);g.fill();g.stroke();g.fillStyle=pal.acc;g.fillText(PU[p.t][0],p.x,p.y+1)}
  g.fillStyle=pal.acc;for(const l of las)g.fillRect(l.x-1.5,l.y,3,12);
  for(const p of parts){g.globalAlpha=Math.min(1,p.t*2);g.fillStyle=pal.b[p.c-1];g.fillRect(p.x,p.y,3.5,3.5)}
  g.globalAlpha=1;
  g.fillStyle=pal.ink;g.font='700 15px '+UIF;g.textAlign='left';g.fillText('SCORE '+sc,12,20);
  g.textAlign='center';g.fillText('Lv '+lv,W/2,20);
  g.textAlign='left';g.fillStyle=pal.acc;g.fillText('♥'.repeat(lives),12,44);
  if(combo>1){g.textAlign='center';g.fillText('COMBO ×'+combo,W/2,44)}
  g.textAlign='right';g.fillStyle=pal.ink;g.font='700 13px '+UIF;
  let ex=W-48;for(const k in eff)if(eff[k]>0){g.fillText(PU[k][0]+Math.ceil(eff[k]),ex,44);ex-=40}
  if(ban){g.globalAlpha=Math.min(1,ban.t*2);g.textAlign='center';g.fillStyle=pal.acc;g.font='800 30px '+pal.disp;g.fillText(ban.s,W/2,H/2);g.globalAlpha=1}
  if(st=='ready'){g.textAlign='center';g.fillStyle=pal.ink;g.font='700 14px '+UIF;g.fillText('Tap or press Space to launch',W/2,H-80)}
}
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(t-last)/1000||0);last=t;
  if(st=='play'||st=='ready')upd(dt);
  draw();
}
function ui(h){const o=$('#ov');o.innerHTML=h;o.classList.add('show');$('#pb').style.display='none'}
function hide(){$('#ov').classList.remove('show');$('#pb').style.display='block'}
function menu(){
  st='menu';
  ui(`<h1>崩し</h1><p>Kuzushi · Brick Breaker</p><button class="btn go" data-a="play">Play</button><button class="btn" data-a="dys">${dysLabel()}</button>
  <select id="th" aria-label="Style">${TH.map(t=>`<option value="${t[0]}"${document.documentElement.dataset.theme==t[0]?' selected':''}>${t[1]}</option>`).join('')}</select>
  <p>Best score <b>${hi}</b></p><div class="legend">${Object.values(PU).map(p=>`<span><b>${p[0]}</b>${p[1]}</span>`).join('')}</div>
  <p>Drag, mouse or ←/→ to move<br>Tap or Space to launch</p>`);
}
function play(){lv=1;sc=0;lives=3;load(1);ban={t:1.4,s:'Level 1'};hide()}
function pause(){
  if(st!='play'&&st!='ready')return;
  prev=st;st='pause';
  ui('<h1>休</h1><p>Paused</p><button class="btn go" data-a="resume">Resume</button><button class="btn" data-a="menu">Quit to menu</button>');
}
function resume(){st=prev;hide();last=0}
function toggleDys(){
  const on=!document.documentElement.hasAttribute('data-dys');
  document.documentElement.toggleAttribute('data-dys',on);
  try{localStorage.setItem('dys',on?'1':'0')}catch(e){}
  (document.fonts&&document.fonts.load('16px OpenDyslexic')||Promise.resolve()).catch(()=>{}).then(()=>setTheme(document.documentElement.dataset.theme));
}
const dysLabel=()=>'Dyslexia font: '+(document.documentElement.hasAttribute('data-dys')?'On':'Off');
function setTheme(t){
  document.documentElement.dataset.theme=t;try{localStorage.setItem('bb-t',t)}catch(e){}
  document.querySelector('meta[name=theme-color]').content=(TH.find(x=>x[0]==t)||TH[0])[2];
  const c=getComputedStyle(document.documentElement),v=n=>c.getPropertyValue(n).trim();
  pal={ink:v('--ink'),acc:v('--accent'),face:v('--face'),edge:v('--edge'),b:[v('--b1'),v('--b2'),v('--b3')],gl:+v('--gl')||0,disp:v('--disp')};UIF=v('--ui')||UIF;
}
$('#ov').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a=='play')play();else if(a=='menu')menu();else if(a=='resume')resume();else if(a=='dys'){toggleDys();menu()}};
$('#ov').onchange=e=>{if(e.target.id=='th')setTheme(e.target.value)};
$('#pb').onclick=e=>{e.stopPropagation();pause()};
const mx=e=>{const r=cv.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*W};
$('#wrap').addEventListener('pointermove',e=>{if(st=='play'||st=='ready')mx(e)});
$('#wrap').addEventListener('pointerdown',e=>{if(e.target.closest('button,select')||(st!='play'&&st!='ready'))return;mx(e);launch()});
addEventListener('keydown',e=>{
  if(e.key=='ArrowLeft'||e.key=='a')keys.l=1;
  else if(e.key=='ArrowRight'||e.key=='d')keys.r=1;
  else if(e.key==' '){e.preventDefault();if(st=='pause')resume();else launch()}
  else if(e.key=='p'||e.key=='Escape')st=='pause'?resume():pause();
});
addEventListener('keyup',e=>{if(e.key=='ArrowLeft'||e.key=='a')keys.l=0;if(e.key=='ArrowRight'||e.key=='d')keys.r=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
setTheme(document.documentElement.dataset.theme||'light');
load(1);menu();requestAnimationFrame(frame);
</script>
</body>
</html>
