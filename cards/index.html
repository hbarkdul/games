*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden;-webkit-touch-callout:none}
.bg{position:fixed;inset:0;width:100%;height:100%;color:var(--wave);opacity:var(--waveo);pointer-events:none}
.bg rect{fill:var(--pat,url(#sg))}
.app{position:relative;height:100%;max-width:900px;margin:0 auto;padding:10px 10px 8px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:10px;font:700 14px var(--ui)}
.top h1{margin:0;font:800 20px var(--disp);text-shadow:var(--glow)}
#info{margin-left:auto;opacity:.85}
#board{position:relative;flex:1;min-height:0}
.pile{position:absolute}
.slot{position:absolute;inset:0;border:1.5px dashed var(--slot);border-radius:calc(var(--cw)*.1);display:grid;place-items:center;font:700 calc(var(--cw)*.4) var(--num);color:var(--slot)}
.cnt{position:absolute;right:-2px;bottom:-2px;background:var(--accent);color:var(--face);font:800 11px var(--ui);border-radius:9px;padding:1px 6px;z-index:99}
.card{position:absolute;left:0;width:100%;height:100%;border-radius:calc(var(--cw)*.1);border:1.5px solid var(--edge);font:800 calc(var(--cw)*.3)/1 var(--num);box-shadow:0 1px 3px #0006;overflow:hidden}
.card.up{background:var(--face)}.card.r{color:var(--red)}.card.k{color:var(--blk)}
.card.dn{background:var(--back) center/cover #222}
.card b,.card s{position:absolute;top:3%;text-decoration:none;font-weight:800}
.card b{left:8%}.card s{right:8%}
.card em{position:absolute;left:0;right:0;top:38%;text-align:center;font-style:normal;font-size:2em;opacity:.9}
.card{touch-action:none}.card.drag{z-index:1000;box-shadow:0 8px 18px #0009;transition:none}
.card.sel{outline:3px solid var(--accent);outline-offset:-1px;filter:brightness(1.08);z-index:50}
.card.lock{filter:brightness(.78)}
.bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
button{font:inherit}
.bar button,.btn{border:2px solid var(--ink);background:var(--btn);color:var(--ink);font:700 14px var(--ui);border-radius:10px;padding:10px 4px}
button:active{transform:scale(.97)}
.bar button{font-size:12px;padding:9px 0}
.card.hint{outline:3px dashed var(--accent);outline-offset:-2px;animation:pl .7s infinite alternate}
@keyframes pl{to{filter:brightness(1.25)}}
.pile.hint::after{content:"";position:absolute;inset:-4px;border:3px dashed var(--accent);border-radius:8px;pointer-events:none;z-index:99}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:18px;font:700 13px var(--ui);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}#toast.show{opacity:1}
#fx{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
#win{background:transparent;backdrop-filter:none}
#sl{position:fixed;left:-10%;top:45%;width:120%;height:5px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 24px 6px #fff;transform:rotate(-18deg) scaleX(0);z-index:9;pointer-events:none;opacity:0}
#sl.go{animation:sl .6s ease-out}
@keyframes sl{0%{transform:rotate(-18deg) scaleX(0);opacity:1}55%{transform:rotate(-18deg) scaleX(1);opacity:1}100%{transform:rotate(-18deg) scaleX(1);opacity:0}}
.tb{width:100%;border-collapse:collapse;font:600 12px var(--ui)}.tb th,.tb td{padding:6px 3px;border-bottom:1px solid var(--slot);text-align:right}.tb th:first-child,.tb td:first-child{text-align:left}

.lv{display:grid;gap:9px}.lv .btn.alt{border-style:dashed}

#ap.show{transform:translate(-50%,0)}
#ap b{flex:none;width:50px;height:50px;background:var(--accent);color:var(--face);display:grid;place-items:center;font:800 28px var(--disp);border-radius:6px;transform:rotate(-4deg)}
#ap span{display:flex;flex-direction:column;text-align:left;font-family:var(--ui)}
#ap small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}#ap strong{font-size:17px}#ap em{font-size:12px;font-style:normal;opacity:.85}
.ov{position:fixed;inset:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(4px);display:none;place-items:center;padding:14px}
.ov.show{display:grid}
.card2{width:min(440px,100%);max-height:94dvh;overflow:auto;background:var(--bg);border:3px solid var(--edge);padding:16px;text-align:center}
.card2 h2{margin:0 0 10px;font:800 26px var(--disp);text-shadow:var(--glow)}
.card2 h3{margin:14px 0 6px;font:700 12px var(--ui);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.games{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.games button{border:2px solid var(--ink);background:var(--btn);color:var(--ink);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;gap:2px;font:700 14px var(--ui)}
.games b{font:800 17px var(--disp);color:var(--accent);text-shadow:var(--glow)}
.games small{font:500 11px var(--ui);opacity:.7}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font:700 13px var(--ui)}
.seg{display:flex;border:2px solid var(--ink);border-radius:18px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:700 13px var(--ui);padding:5px 14px}
.seg button.on{background:var(--ink);color:var(--bg)}
.thumbs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.thumbs button{width:52px;height:72px;border:2px solid var(--ink);border-radius:6px;padding:0;background-size:cover}

const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function deal(g){
  const P={};let d=[];
  if(g=='sp'){const su=[[0],[0,1],[0,1,2,3]][{1:0,2:1,4:2}[O.suits]];for(let n=0;n<8;n++)for(let r=1;r<14;r++)d.push({r,s:su[n%su.length],u:false})}
  else for(let n=0;n<(g=='ha'?8:4);n++)for(let r=1;r<14;r++)d.push({r,s:n%4,u:false});
  shuf(d);
  const tk=(n,m)=>d.splice(0,n).map((c,i,a)=>(c.u=m=='all'||(m=='last'&&i==a.length-1),c));
  const F=()=>{for(let i=0;i<(g=='ha'?8:4);i++)P['f'+i]=[]};
  if(g=='kl'||g=='cn'){for(let i=0;i<7;i++)P['t'+i]=tk(i+1,'last');P.s=d;P.w=[];F()}
  if(g=='yu'||g=='ru'){P.t0=tk(1,'all');for(let i=1;i<7;i++)P['t'+i]=[...tk(i,'down'),...tk(5,'all')];F()}
  if(g=='fc'){for(let i=0;i<8;i++)P['t'+i]=tk(i<4?7:6,'all');for(let i=0;i<4;i++)P['c'+i]=[];F()}
  if(g=='sp'){for(let i=0;i<10;i++)P['t'+i]=tk(i<4?6:5,'last');P.s=d;P.d=[]}
  if(g=='go'){for(let i=0;i<7;i++)P['t'+i]=tk(5,'all');P.w=tk(1,'all');P.s=d}
  if(g=='py'){for(let i=0;i<28;i++)P['p'+i]=tk(1,'all');P.s=d;P.w=[];P.x=[]}
  if(g=='ha'){for(let i=0;i<9;i++)P['t'+i]=tk(i+1,'last');P.s=d;P.w=[];F()}
  if(g=='ca'){P.r=tk(13,'down');P.r.at(-1).u=true;P.f0=tk(1,'all');for(let i=0;i<4;i++)P['t'+i]=tk(1,'all');for(let i=1;i<4;i++)P['f'+i]=[];P.s=d;P.w=[]}
  return P;
}
function LY(){
  const g=G.g,p=[],T=(n,y,x0=0)=>{for(let i=0;i<n;i++)p.push(['t'+i,x0+i,y])},F=(x,n=4)=>{for(let i=0;i<n;i++)p.push(['f'+i,x+i,0])};
  if(['kl','cn','yu','ru'].includes(g)){if(g=='kl'||g=='cn')p.push(['s',0,0],['w',1,0]);F(3);T(7,1.3);return{c:7,p}}
  if(g=='ca'){p.push(['s',0,0],['w',1,0]);F(3);p.push(['r',0,1.3]);T(4,1.3,2);return{c:7,p}}
  if(g=='ha'){p.push(['s',0,0],['w',1,0]);F(2,8);T(9,1.3,.5);return{c:10,p}}
  if(g=='fc'){for(let i=0;i<4;i++)p.push(['c'+i,i,0]);F(4);T(8,1.3);return{c:8,p}}
  if(g=='sp'){p.push(['s',0,0],['d',9,0]);T(10,1.3);return{c:10,p}}
  if(g=='go'){T(7,0);p.push(['s',2,2.75],['w',3,2.75]);return{c:7,p}}
  for(let r=0;r<7;r++)for(let k=0;k<=r;k++)p.push(['p'+(r*(r+1)/2+k),(6-r)/2+k,r*.5]);
  p.push(['s',2,4.6],['w',3,4.6]);return{c:7,p};
}
const free=id=>{const P=G.piles,n=+id.slice(1);let r=0;while((r+1)*(r+2)/2<=n)r++;const k=n-r*(r+1)/2;return r==6||(!P['p'+((r+1)*(r+2)/2+k)].length&&!P['p'+((r+1)*(r+2)/2+k+1)].length)};

      let tot=0;A.slice(0,-1).forEach(c=>tot+=c.u?uo:dn);
      const sc=tot>avail&&tot>0?Math.max(avail,0)/tot:1;let t=0;
      A.forEach((c,j)=>{cs+=card(c,j,t*sc,sel&&sel.p==id&&j>=sel.i,0,hv&&hv.p==id&&j>=hv.i);t+=c.u?uo:dn});
    }else if(A.length){const j=A.length-1;cs=card(A[j],j,0,sel&&sel.p==id&&sel.i==j,k=='p'&&!free(id),hv&&(hv.p==id||(G.g=='py'&&hv.q==id)))}
    h+=`<div class="pile${hv&&hv.q==id?' hint':''}" data-p="${id}" style="left:${ox+x*(cw+gp)}px;top:${tp}px;width:${cw}px;height:${ch}px"><span class="slot">${k=='f'?(G.g=='ca'?RK[G.base]:'A'):k=='s'?'↻':''}</span>${cs}${k=='d'&&A.length?`<span class="cnt">${A.length/13|0}</span>`:''}${(k=='s'||k=='r')&&A.length?`<span class="cnt">${A.length}</span>`:''}</div>`;

function card(c,j,top,sel,lock,ht){

function can(p,i,q){
  const P=G.piles,A=P[p],B=P[q],c=A[i],k=q[0],g=G.g;
  if(p==q)return false;
  if(k=='f'){if(i!=A.length-1)return false;const t=B.at(-1);return t?t.s==c.s&&c.r==nx(t.r):c.r==(g=='ca'?G.base:1)&&(g=='ha'||!FN().some(x=>P[x].length&&P[x][0].s==c.s))}
  if(k=='c')return g=='fc'&&i==A.length-1&&!B.length;
  if(k!='t')return false;
  const t=B.at(-1);
  if(g=='fc'){
    let fc=0,et=0;for(const id in P){if(id[0]=='c'&&!P[id].length)fc++;if(id[0]=='t'&&!P[id].length&&id!=q)et++}
    if(A.length-i>(fc+1)*2**et)return false;
    return t?(red(t)!=red(c)&&t.r==nx(c.r)):true;
  }
  if(g=='sp')return !t||t.r==nx(c.r);
  if((g=='ha'||g=='cn')&&!O.free&&t&&i<A.length-1)return false;
  return t?(t.u&&(g=='ru'?t.s==c.s:red(t)!=red(c))&&t.r==nx(c.r)):(g=='ca'||c.r==13);
}
function pick(p,i){
  const A=G.piles[p],c=A[i],k=p[0],g=G.g;
  if(!c||!c.u)return false;
  if(k=='w'||k=='c'||k=='f'||k=='r')return i==A.length-1;
  if(k!='t')return false;
  if(['kl','yu','ru','ca'].includes(g))return true;
  if((g=='ha'||g=='cn')&&i==A.length-1)return true;
  if((g=='ha'||g=='cn')&&!O.free&&c.r!=13)return false;
  for(let j=i;j<A.length-1;j++){const a=A[j],b=A[j+1];if(a.r!=nx(b.r)||(g=='sp'?a.s!=b.s:red(a)==red(b)))return false}
  return true;
}

function after(){

function draw(){

function tap(p,i){

$('#br').onclick=()=>{if(G&&!busy&&(!G.moves||confirm('Replay this deal from the start?')))start(G.g,true)};
$('#bn').onclick=()=>{if(G&&!busy&&(!G.moves||G.won||confirm('Abandon this game and deal a new one?')))start(G.g)};
$('#bh').onclick=hint;
$('#pg').onclick=e=>{if(e.target.id=='pg'||e.target.closest('[data-close]'))$('#pg').classList.remove('show')};
$('#bu').onclick=()=>{if(!G||G.won||busy)return;const s=G.h.pop();if(!s)return;[G.piles,G.moves,G.rd]=JSON.parse(s);G.u=(G.u||0)+1;sel=null;hv=null;save();render()};
$('#wn').onclick=()=>{$('#win').classList.remove('show');menu()};
$('#wd').onclick=()=>{$('#win').classList.remove('show');start(G.g)};
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),ms)}
const AC=[
['w1','初','First Win','Win any game',c=>1],
['w10','十','Ten Wins','Win 10 games',c=>c.tw>=10],
['p50','百','Dedicated','Play 50 deals',c=>c.tp>=50],
['fast','疾','Swift','Win in under 3 minutes',c=>c.G.t<180],
['nou','無','No Undo','Win without using Undo',c=>!c.G.u],
['nohi','独','Unaided','Win without using Hint',c=>!c.G.hn],
['k3','三','Draw Three','Win Klondike drawing 3 cards',c=>c.G.g=='kl'&&c.O.draw==3],
['s4','蜘','Spider Master','Win Spider with 4 suits',c=>c.G.g=='sp'&&c.O.suits==4],
['cf','縁','Canfield Fortune','Win Canfield',c=>c.G.g=='ca'],
['hp','琴','Harpist','Win The Harp',c=>c.G.g=='ha'],
['all','全','Well Rounded','Win every game at least once',c=>Object.keys(GM).every(k=>(c.S[k]||{}).w)]
];
const aq=[];let ab=false;
function apop(){
  if(ab||!aq.length)return;ab=true;
  const a=aq.shift(),el=$('#ap');
  el.innerHTML=`<b>${a[1]}</b><span><small>実績 Achievement unlocked</small><strong>${a[2]}</strong><em>${a[3]}</em></span>`;
  el.classList.add('show');clearTimeout(apop.t);apop.t=setTimeout(aclose,3600);
}
function aclose(){clearTimeout(apop.t);$('#ap').classList.remove('show');setTimeout(()=>{ab=false;apop()},450)}
$('#ap').onclick=aclose;
function ach(S){
  let A={};try{A=JSON.parse(localStorage.getItem('cg-a'))||{}}catch(e){}
  const V=Object.values(S),c={G,O,S,tw:V.reduce((a,r)=>a+r.w,0),tp:V.reduce((a,r)=>a+r.p,0)};
  let n=0;
  for(const a of AC)if(!A[a[0]]&&a[4](c)){A[a[0]]=1;aq.push(a);n++}
  if(n){try{localStorage.setItem('cg-a',JSON.stringify(A))}catch(e){}setTimeout(apop,1100)}
}
function page(x){
  const pg=$('#pg');let h='';
  if(x=='stats'){
    const S=ST();let tp=0,tw=0,tt=0;
    const rows=Object.entries(GM).map(([k,v])=>{const r=S[k]||{p:0,w:0,tt:0,b:0};tp+=r.p;tw+=r.w;tt+=r.tt;return `<tr><td>${v[0]}</td><td>${r.p}</td><td>${r.w}</td><td>${r.p?Math.round(r.w/r.p*100):0}%</td><td>${r.w?fmt(Math.round(r.tt/r.w)):'–'}</td><td>${r.b?fmt(r.b):'–'}</td></tr>`}).join('');
    h=`<h2>統計 Stats</h2><table class="tb"><tr><th>Game</th><th>Played</th><th>Won</th><th>Win %</th><th>Avg</th><th>Best</th></tr>${rows}<tr><th>Total</th><th>${tp}</th><th>${tw}</th><th>${tp?Math.round(tw/tp*100):0}%</th><th>${tw?fmt(Math.round(tt/tw)):'–'}</th><th></th></tr></table>`;
  }else{
    let A={};try{A=JSON.parse(localStorage.getItem('cg-a'))||{}}catch(e){}
    h=`<h2>実績 Achievements</h2><div class="al">${AC.map(a=>`<div class="${A[a[0]]?'':'lk'}"><b>${a[1]}</b><span><strong>${a[2]}</strong><br><small>${a[3]}</small></span></div>`).join('')}</div><p>${Object.keys(A).length} / ${AC.length}</p>`;
  }
  pg.innerHTML=`<div class="card2">${h}<button class="btn" data-close style="width:100%;margin-top:12px">Close</button></div>`;pg.classList.add('show');
}
function moves(ic){
  const P=G.piles,g=G.g,ms=[];
  if(g=='go'){for(let i=0;i<7;i++){const A=P['t'+i];if(A.length&&Math.abs(A.at(-1).r-P.w.at(-1).r)==1)ms.push({p:'t'+i,i:A.length-1,q:'w',sc:1})}}
  else if(g=='py'){
    const ex=Object.keys(P).filter(k=>P[k].length&&((k[0]=='p'&&free(k))||k=='w'));
    for(const a of ex){const x=P[a].at(-1);if(x.r==13)ms.push({p:a,i:0,q:null,sc:2});for(const b of ex)if(a<b&&x.r+P[b].at(-1).r==13)ms.push({p:a,i:0,q:b,sc:1})}
  }else for(const p in P){
    const k=p[0];if(!'twcr'.includes(k))continue;
    P[p].forEach((c,i)=>{
      if(!pick(p,i))return;
      const prev=P[p][i-1];
      for(const q in P){
        const k2=q[0];if(!(ic?'tfc':'tf').includes(k2)||!can(p,i,q))continue;
        let sc=k2=='f'?100:10;
        if(k2=='t'){
          if(i==0&&!P[q].length)continue;
          if(prev&&prev.u&&prev.r==nx(c.r)&&(g=='sp'||g=='ru'?prev.s==c.s:red(prev)!=red(c)))continue;
          if(prev&&!prev.u)sc+=50;
          if(k=='w'||k=='r')sc+=20;if(k=='c')sc+=30;
        }
        ms.push({p,i,q,sc});if(k2=='f')break;
      }
    });
  }
  return ms;
}
function flyDeal(){
  const st=document.querySelector('.pile[data-p="s"]');
  if(!st||(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches))return;
  const sr=st.getBoundingClientRect(),els=[];busy=true;
  for(let j=0;j<10;j++){
    const c=document.querySelector(`.pile[data-p="t${j}"] .card:last-child`);if(!c)continue;
    const r=c.getBoundingClientRect();
    c.style.transition='none';c.style.zIndex=60+j;c.style.transform=`translate(${sr.left-r.left}px,${sr.top-r.top}px)`;els.push(c);
  }
  void document.body.offsetWidth;
  els.forEach((c,j)=>{c.style.transition=`transform .38s cubic-bezier(.2,.8,.3,1) ${j*70}ms`;c.style.transform='none'});
  setTimeout(()=>{busy=false;els.forEach(c=>{c.style.transition='';c.style.zIndex=''});lose()},1150);
}
function stuck(){
  if(!G||G.won)return false;
  const P=G.piles,g=G.g;
  if(moves(g=='fc').length)return false;
  if(g=='sp')return !P.s.length||Object.keys(P).some(k=>k[0]=='t'&&!P[k].length);
  if(g=='go')return !P.s.length;
  const sw=[...(P.s||[]),...(P.w||[])];
  if(!sw.length)return true;
  const rec=g=='py'||g=='kl'||g=='ca'||(g=='ha'&&(G.rd||0)<3)||(g=='cn'&&(G.rd||0)<1);
  const pool=rec?sw:[...P.s,...(P.w.length?[P.w.at(-1)]:[])];
  if(g=='py'){const ex=Object.keys(P).filter(k=>k[0]=='p'&&P[k].length&&free(k)).map(k=>P[k][0].r);return !pool.some(c=>c.r==13||ex.some(x=>x+c.r==13))}
  return !pool.some(c=>{P.__x=[c];const ok=Object.keys(P).some(q=>'tf'.includes(q[0])&&can('__x',0,q));delete P.__x;return ok});
}
function lose(){
  if(!G||G.won||busy||G.stk===G.moves||!stuck())return;
  G.stk=G.moves;
  $('#over').innerHTML='<div class="card2"><h2>行き詰まり</h2><p>No more moves are available.</p><div class="lv"><button class="btn" data-a="undo">戻 Undo last move</button><button class="btn" data-a="retry">再 Redeal from the start</button><button class="btn" data-a="new">新 Deal new game</button><button class="btn" data-a="menu">☰ Main menu</button><button class="btn alt" data-a="close">Keep looking</button></div></div>';
  $('#over').classList.add('show');
}
$('#over').onclick=e=>{
  const a=e.target.closest('[data-a]');if(!a)return;const v=a.dataset.a;$('#over').classList.remove('show');
  if(v=='undo')$('#bu').onclick();else if(v=='retry')start(G.g,true);else if(v=='new')start(G.g);else if(v=='menu')menu();
};
function hint(){
  if(!G||G.won||busy)return;
  const P=G.piles,g=G.g,ms=moves();
  ms.sort((a,b)=>b.sc-a.sc);const m=ms[0];
  if(m)hv={p:m.p,i:m.i,q:m.q};
  else if(g=='sp'&&Object.keys(P).some(k=>k[0]=='t'&&!P[k].length))return toast('Fill the empty column before dealing');
  else if(P.s&&(P.s.length||(P.w&&P.w.length&&g!='go'))){hv={q:'s'};toast('Try drawing from the stock')}
  else return toast('No moves found — try Undo or a new deal');
  G.hn=(G.hn||0)+1;render();
  const h0=hv;setTimeout(()=>{if(hv===h0){hv=null;render()}},3200);
}
let raf=0;
function cascade(){
  const cv=$('#fx'),c=cv.getContext('2d'),W=innerWidth,H=innerHeight;cv.width=W;cv.height=H;cv.style.display='block';
  const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim()||'#fff';
  const face=v('--face'),rd=v('--red'),bk=v('--blk'),edge=v('--edge'),cw=Math.min(64,W/6),ch=cw*1.4,cards=[];let n=0,last=0;
  cancelAnimationFrame(raf);
  const loop=ts=>{
    if(!$('#win').classList.contains('show')){cv.style.display='none';return}
    if(ts-last>320&&n<52){last=ts;cards.push({x:Math.random()*(W-cw),y:-ch,vx:(Math.random()<.5?-1:1)*(1.5+Math.random()*3.5),vy:0,r:13-(n/4|0),s:n%4});n++}
    for(const k of cards){
      k.vy+=.45;k.x+=k.vx;k.y+=k.vy;if(k.y+ch>H){k.y=H-ch;k.vy*=-.78}
      c.fillStyle=face;c.strokeStyle=edge;c.lineWidth=1.5;c.fillRect(k.x,k.y,cw,ch);c.strokeRect(k.x,k.y,cw,ch);
      c.fillStyle=k.s==1||k.s==2?rd:bk;c.font=`800 ${cw*.34}px serif`;c.fillText(RK[k.r]+SU[k.s],k.x+4,k.y+cw*.38);
    }
    raf=requestAnimationFrame(loop);
  };
  raf=requestAnimationFrame(loop);
}
function autoStep(){
  const P=G.piles;
  for(const id in P){
    const k=id[0];if(!'twcr'.includes(k))continue;
    const A=P[id];if(!A.length)continue;
    for(const f of FN())if(can(id,A.length-1,f)){P[f].push(A.pop());G.moves++;after();return true}
  }
  return false;
}
function auto(){
  if(busy||!G||G.won||!FG.includes(G.g))return;
  snap();
  if(!autoStep()){G.h.pop();return}
  busy=true;
  const iv=setInterval(()=>{if(!autoStep()){clearInterval(iv);busy=false;lose()}},90);
}
$('#ba').onclick=auto;
function dropOn(d,q){
  const g=G.g;sel=null;
  if(g=='go'){if(q[0]=='w')tap(d.p,d.i);else render();return}
  if(g=='py'){
    tap(d.p,d.i);
    if(sel&&sel.p==d.p&&(q[0]=='p'||q[0]=='w')&&G.piles[q].length){const m=G.moves;tap(q,G.piles[q].length-1);if(G.moves==m){sel=null;render()}}
    return;
  }
  if(can(d.p,d.i,q))mv(d.p,d.i,q);else render();
}
const pileAt=(x,y,not)=>document.elementsFromPoint(x,y).map(el=>el.closest&&el.closest('.pile')).find(el=>el&&el.dataset.p!==not);
$('#board').addEventListener('pointerdown',e=>{
  if(!G||G.won||busy||e.button>0)return;
  const cd=e.target.closest('.card'),pl=e.target.closest('.pile');if(!cd||!pl)return;
  const p=pl.dataset.p,i=+cd.dataset.i,k=p[0],A=G.piles[p];
  const ok=G.g=='go'?k=='t'&&i==A.length-1:G.g=='py'?(k=='w'||(k=='p'&&free(p)))&&i==A.length-1:k!='s'&&pick(p,i);
  if(ok)drag={p,i,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,els:[]};
});
addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){
    if(Math.hypot(dx,dy)<8)return;
    drag.on=true;sel=null;
    drag.els=[...document.querySelectorAll(`.pile[data-p="${drag.p}"] .card`)].filter(c=>+c.dataset.i>=drag.i);
    drag.els.forEach(c=>{c.classList.remove('sel');c.classList.add('drag')});
  }
  drag.els.forEach(c=>c.style.transform=`translate(${dx}px,${dy}px)`);
  e.preventDefault();
},{passive:false});
addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;if(!d.on)return;
  noClick=Date.now();
  const t=pileAt(e.clientX,e.clientY,d.p);
  if(t)dropOn(d,t.dataset.p);else render();
});
addEventListener('pointercancel',()=>{if(drag&&drag.on)render();drag=null});
addEventListener('resize',render);
setInterval(()=>{if(G&&!G.won&&!document.hidden){G.t++;info();if(G.t%5==0)save()}},1000);
try{const s=JSON.parse(localStorage.getItem('cg1'));if(s){O=Object.assign(O,s.O);if(s.G&&s.G.piles)G=s.G}}catch(e){}
applyLook();
function setDys(on,save){
  document.documentElement.toggleAttribute('data-dys',on);
  const b=$('#dys');b.setAttribute('aria-pressed',on);b.classList.toggle('on',on);
  if(save)try{localStorage.setItem('dys',on?'1':'0')}catch(e){}
}
$('#dys').onclick=()=>setDys(!document.documentElement.hasAttribute('data-dys'),true);
try{setDys(localStorage.getItem('dys')=='1',false)}catch(e){}
if(G&&!G.won)render();else{G=null;menu()}
</script>
