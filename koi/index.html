ale(.7)"/></pattern><pattern id="fx" width="48" height="48" patternUnits="userSpaceOnUse"><g fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 5C18 12 19 19 12 26C5 19 6 12 12 5Z"/><path d="M36 26C42 33 43 40 36 47C29 40 30 33 36 26Z"/><path d="M12 14C14 17 14 20 12 22"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#sg)"/></svg>

<script>
const TITLE="鯉池 Koi Pond",KEY="kp";
const $=s=>document.querySelector(s);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const TH=[['light','Woodblock 浮世絵','#e6e0cf'],['dark','Neon ネオン','#0b0820'],['samurai','Samurai 侍','#0e0d0d'],['ninja','Ninja 忍','#090d0a'],['geisha','Geisha 芸者','#efd5d6'],['kabuki','Kabuki 歌舞伎','#f6e6b0'],['dragon','Dragon 龍','#1a0606'],['koi','Koi 鯉','#150e0a'],['imperial','Imperial 皇室','#ede6f5'],['kitsune','Kitsune 狐','#05061a']];
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.random()*n|0;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=t=>(t/60|0)+':'+String(t%60).padStart(2,'0');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function setTheme(t){
  document.documentElement.dataset.theme=t;put(KEY+'-t',t);
  document.querySelector('meta[name=theme-color]').content=(TH.find(x=>x[0]==t)||TH[0])[2];
  if(typeof onTheme=='function')onTheme();
}
function toggleDys(){
  const on=!document.documentElement.hasAttribute('data-dys');
  document.documentElement.toggleAttribute('data-dys',on);put('dys',on?'1':'0');
  (document.fonts&&document.fonts.load('16px OpenDyslexic')||Promise.resolve()).catch(()=>{}).then(()=>setTheme(document.documentElement.dataset.theme));
}
const dysLabel=()=>'Dyslexia font: '+(document.documentElement.hasAttribute('data-dys')?'On':'Off');
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),ms||2400)}
function ui(h){const o=$('#ov');o.innerHTML=h;o.classList.add('show')}
function hideUi(){$('#ov').classList.remove('show')}
function openMenu(){
  ui(`<div class="card"><h2>${TITLE}</h2>${typeof menuHTML=='function'?menuHTML():''}<select id="th" aria-label="Style">${TH.map(t=>`<option value="${t[0]}"${document.documentElement.dataset.theme==t[0]?' selected':''}>${t[1]}</option>`).join('')}</select><button class="btn" data-a="dys">${dysLabel()}</button><button class="btn" data-a="close">Close</button></div>`);
}
$('#ov').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(!a)return;
  if(a=='close')hideUi();else if(a=='dys'){toggleDys();openMenu()}else if(typeof act=='function')act(a,b);
};
$('#ov').onchange=e=>{if(e.target.id=='th')setTheme(e.target.value)};
$('#bm').onclick=openMenu;


const W=360,H=520,cv=$('#cv');let g=cv.getContext('2d');cv.width=W;cv.height=H;
const COL=[['Beni','#d9351f','#fff4ea'],['Shiro','#f5f1e8','#d9351f'],['Ogon','#e8b923','#fff3c0'],['Orenji','#f26a1d','#ffe3b8'],['Kuro','#2a2a33','#f5f1e8'],['Asagi','#5a86b3','#e3edf6'],['Platinum','#cfd6dc','#ffffff'],['Cream','#f2dc8a','#f26a1d'],['Chagoi','#8a5a2b','#ecc98f'],['Midori','#6f9a4a','#eef5c8'],['Murasaki','#7a4a9e','#f3d9ff'],['Sakura','#f0a6bc','#ffffff']];
const PAT=['Solid','Spots','Patches','Stripe','Tancho','Bands','Speckle','Saddle','Two-tone','Scales'];
const GROW=[6,14],LEN=[34,46,60],DROP=[[14,10,'#b0763a'],[12,25,'#cfd6dc'],[10,50,'#e8b923']];
const MH={kappa:7,namazu:45,crab:4},MR={kappa:16,namazu:38,crab:14};
const COST={koi:100,food:[150,400],pel:[200,500],tap:[250,600]};
const LUX=[
 {id:'frog',k:'蛙',n:'Pond frog',p:2500,d:'Sits on a lily pad and drops a free food pellet every 7 seconds.'},
 {id:'crab',k:'蟹',n:'Helper crab',p:3500,d:'Patrols the pond floor and collects coins for you.'},
 {id:'gold',k:'金',n:'Golden koi',p:4000,d:'Never starves. Drops a 100-yen coin every 15 seconds.'},
 {id:'fight',k:'闘',n:'Fighting koi',p:4500,d:'Hunts monsters and bites them automatically.'},
 {id:'oyster',k:'貝',n:'Pearl oyster',p:5000,d:'Makes a 250-yen pearl every 40 seconds.'},
 {id:'turtle',k:'亀',n:'Guardian turtle',p:6000,d:'Slows nearby monsters and shields koi close to it from being eaten.'},
 {id:'mother',k:'母',n:'Mother koi',p:8000,d:'Gives birth to a free koi every minute, a new colour and pattern each time.'},
 {id:'lucky',k:'招',n:'Lucky koi',p:10000,d:'Every coin you collect is worth 25% more.'}];
const LK={gold:[2,0],fight:[4,5],mother:[1,4],lucky:[1,2]};
let lvl=+get('kp-l')||1,maxL=+get('kp-u')||1,fish=[],food=[],coins=[],mons=[],fx=[],yen=0,earned=0,goal=3000,up={food:0,pel:0,tap:0},mt={},over=false,paused=false,t=0,last=0,pal={},uid=0,sv=0;
let alb=(get('kp-a')||'').padEnd(120,'0').slice(0,120);
let bank=+get('kp-b')||0,owned=[],loadout=[],lux=[],won=false;
try{owned=JSON.parse(get('kp-o'))||[];loadout=JSON.parse(get('kp-d'))||[]}catch(e){}
const savePrefs=()=>{put('kp-o',JSON.stringify(owned));put('kp-d',JSON.stringify(loadout));put('kp-b',Math.floor(bank))};
const PC=()=>[3,5,8][up.pel];
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296};
function disc(id){if(alb[id]!='1'){alb=alb.slice(0,id)+'1'+alb.slice(id+1);put('kp-a',alb)}}
function addFish(c,p,x,y,st,keep){
  const f={id:++uid,c,p,st:st||0,eat:0,hung:keep?keep.hung:rnd(20),x,y,a:keep?keep.a:Math.random()*6.28,sp:50,wag:rnd(6),tx:x,ty:y,tcool:0,coinT:4+rnd(8),seg:[],seed:rnd(1e6),panic:0,dead:0,df:0};
  const sp=LEN[f.st]/6;for(let i=0;i<7;i++)f.seg.push([x-Math.cos(f.a)*i*sp,y-Math.sin(f.a)*i*sp]);
  disc(c*10+p);fish.push(f);return f;
}
const rndFish=(x,y)=>addFish(rnd(12),rnd(10),x,y,0);
function newLevel(l){
  lvl=l;put('kp-l',l);goal=3000*l;yen=120;earned=0;up={food:0,pel:0,tap:0};fish=[];food=[];coins=[];mons=[];fx=[];over=false;t=0;
  mt={kappa:38,namazu:95,crab:55};for(let i=0;i<3;i++)rndFish(70+i*110,140+rnd(180));
  lux=loadout.filter(id=>owned.includes(id)).slice(0,2).map(mkLux);won=false;
  hideUi();hud();
}
function upFish(f,dt){
  if(f.dead){f.df+=dt;if(f.dead==1){f.y=Math.max(30,f.y-14*dt);for(const s of f.seg)s[1]-=14*dt}return}
  f.hung+=dt;f.wag+=dt*(3.5+f.sp*.05);f.panic=Math.max(0,f.panic-dt);
  if(f.hung>100){f.dead=1;return}
  let tg=null;
  if(f.hung>30){let bd=1e9;for(const fd of food)if(!fd.eaten){const d=Math.hypot(fd.x-f.x,fd.y-f.y);if(d<bd){bd=d;tg=fd}}}
  if(tg){f.tx=tg.x;f.ty=tg.y}else{f.tcool-=dt;if(f.tcool<=0||Math.hypot(f.tx-f.x,f.ty-f.y)<14){f.tx=30+rnd(W-60);f.ty=60+rnd(H-130);f.tcool=2+Math.random()*4}}
  for(const m of mons)if(m.k!='crab'&&Math.hypot(m.x-f.x,m.y-f.y)<95){f.tx=Math.max(20,Math.min(W-20,f.x+(f.x-m.x)));f.ty=Math.max(50,Math.min(H-60,f.y+(f.y-m.y)));f.panic=1.2}
  const want=Math.atan2(f.ty-f.y,f.tx-f.x),da=((want-f.a+Math.PI*3)%(Math.PI*2))-Math.PI;f.a+=Math.max(-3*dt,Math.min(3*dt,da));

  g.globalAlpha=sil?.2:1;pathPts(pts);g.fillStyle=sil?pal.ink:c1;g.fill();g.globalAlpha=1;
  if(!sil){g.save();pathPts(pts);g.clip();pattern(f,seg,len,c2);g.restore();g.strokeStyle='rgba(0,0,0,.22)';g.lineWidth=1;pathPts(pts);g.stroke();
    const e1=at(seg,.05,.15,len),e2=at(seg,.05,-.15,len);g.fillStyle='#111';g.beginPath();g.arc(e1[0],e1[1],len*.035,0,7);g.arc(e2[0],e2[1],len*.035,0,7);g.fill()}
  g.restore();
}
function drawMon(m){
  g.save();g.translate(m.x,m.y);if(m.flash>0)g.globalAlpha=.55;
  const k=m.k;g.textAlign='center';g.textBaseline='middle';
  if(k=='kappa'){g.fillStyle='#4d8a43';g.beginPath();g.arc(0,2,m.r,0,7);g.fill();g.fillStyle='#8a6a2b';g.beginPath();g.ellipse(0,6,m.r*.8,m.r*.7,0,0,7);g.fill();g.fillStyle='#6fb061';g.beginPath();g.arc(0,-m.r*.7,m.r*.62,0,7);g.fill();g.fillStyle='#d9e8f5';g.beginPath();g.ellipse(0,-m.r*1.2,m.r*.32,m.r*.14,0,0,7);g.fill();g.fillStyle='#e8b923';g.beginPath();g.moveTo(m.r*.2,-m.r*.55);g.lineTo(m.r*.7,-m.r*.45);g.lineTo(m.r*.2,-m.r*.35);g.fill();g.fillStyle='#111';g.beginPath();g.arc(-m.r*.2,-m.r*.8,2.3,0,7);g.fill();g.fillStyle='#fff';g.font='800 12px '+pal.disp;g.fillText('河',0,7)}
  else if(k=='namazu'){g.fillStyle='#3d4650';g.beginPath();g.ellipse(0,0,m.r*1.1,m.r*.62,0,0,7);g.fill();g.beginPath();g.moveTo(-m.r*1.0,0);g.lineTo(-m.r*1.5,-m.r*.4);g.lineTo(-m.r*1.5,m.r*.4);g.fill();g.strokeStyle='#3d4650';g.lineWidth=3;g.beginPath();g.moveTo(m.r*.9,-4);g.quadraticCurveTo(m.r*1.4,-m.r*.4,m.r*1.5,-m.r*.1);g.moveTo(m.r*.9,6);g.quadraticCurveTo(m.r*1.4,m.r*.5,m.r*1.5,m.r*.25);g.stroke();g.fillStyle='#ddd';g.beginPath();g.arc(m.r*.55,-m.r*.15,4,0,7);g.fill();g.fillStyle='#fff';g.font='800 20px '+pal.disp;g.fillText('鯰',-4,2)}
  else{g.fillStyle='#d9531e';g.beginPath();g.ellipse(0,0,m.r,m.r*.7,0,0,7);g.fill();for(const s of[-1,1]){g.beginPath();g.arc(s*m.r*1.05,-m.r*.55,m.r*.38,0,7);g.fill();g.strokeStyle='#d9531e';g.lineWidth=2;for(let i=0;i<3;i++){g.beginPath();g.moveTo(s*m.r*.6,i*4);g.lineTo(s*m.r*1.3,m.r*.4+i*3);g.stroke()}}g.fillStyle='#fff';g.font='800 14px '+pal.disp;g.fillText('蟹',0,1)}
  g.restore();
  if(m.hp<m.mhp){g.fillStyle=pal.ink;g.globalAlpha=.4;g.fillRect(m.x-m.r,m.y-m.r-12,m.r*2,4);g.globalAlpha=1;g.fillStyle=pal.accent;g.fillRect(m.x-m.r,m.y-m.r-12,m.r*2*Math.max(0,m.hp/m.mhp),4)}
}
function draw(){
  g.fillStyle=pal.bg;g.fillRect(0,0,W,H);
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,pal.p1);gr.addColorStop(1,pal.p5);g.globalAlpha=.42;g.fillStyle=gr;g.fillRect(0,0,W,H);g.globalAlpha=1;
  g.strokeStyle=pal.face;g.lineWidth=1.2;g.globalAlpha=.09;for(let k=0;k<7;k++){g.beginPath();for(let x=0;x<=W;x+=8){const y=70+k*68+Math.sin(x*.03+t*.7+k)*10;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}g.globalAlpha=1;
  const r=mul(7);g.fillStyle=pal.ink;g.globalAlpha=.22;for(let i=0;i<46;i++){g.beginPath();g.ellipse(r()*W,H-8-r()*10,4+r()*7,3+r()*4,0,0,7);g.fill()}g.globalAlpha=1;
  g.fillStyle=pal.p3;for(const[x,y,s]of[[60,36,22],[300,52,26],[190,30,16]]){g.globalAlpha=.8;g.beginPath();g.moveTo(x,y);g.arc(x,y,s,.4,6.0);g.closePath();g.fill()}g.globalAlpha=1;
  for(const c of coins){g.globalAlpha=c.age>7?(10-c.age)/3:1;g.fillStyle=c.col;g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=1.5;g.beginPath();g.arc(c.x,c.y,8+Math.min(5,c.v/30),0,7);g.fill();g.stroke();g.fillStyle='rgba(0,0,0,.45)';g.font='800 10px '+pal.disp;g.textAlign='center';g.textBaseline='middle';g.fillText('円',c.x,c.y+1);g.globalAlpha=1}
  for(const fd of food){g.fillStyle='#c9a15a';g.beginPath();g.arc(fd.x,fd.y,4,0,7);g.fill()}
  const sorted=fish.slice().sort((a,b)=>a.y-b.y);
  for(const f of sorted){
    if(f.dead){g.save();g.translate(f.seg[0][0],f.seg[0][1]);g.rotate(Math.PI);g.translate(-f.seg[0][0],-f.seg[0][1]);g.globalAlpha=Math.max(0,1-f.df/3)*.75;drawKoi(f,false);g.restore();continue}
    if(f.hung>60){g.globalAlpha=.8}drawKoi(f,false);g.globalAlpha=1;
    if(f.hung>70){g.fillStyle=pal.accent;g.font='800 15px '+pal.disp;g.textAlign='center';g.textBaseline='middle';g.fillText('!',f.x,f.y-22)}
  }
  mons.forEach(drawMon);lux.forEach(drawLux);
  g.textAlign='center';g.textBaseline='middle';
  for(const f of fx){g.globalAlpha=Math.min(1,f.t*1.5);g.font='800 15px '+pal.disp;g.lineWidth=4;g.strokeStyle=pal.ink;g.strokeText(f.txt,f.x,f.y);g.fillStyle=pal.face;g.fillText(f.txt,f.x,f.y);g.globalAlpha=1}
  g.font='700 11px '+pal.disp;g.fillStyle=pal.face;g.globalAlpha=.7;g.textAlign='left';g.fillText(`Food ${food.length}/${PC()}`,8,H-8);g.globalAlpha=1;
}
/* ---------- album, menu, save ---------- */
function album(){
  ui(`<div class="card"><h2>鯉図鑑 Koi album</h2><p>${alb.split('1').length-1} of 120 discovered. Colours (rows) × patterns (columns): ${COL.map(c=>c[0]).join(', ')}.</p><canvas id="alb" width="540" height="480"></canvas><button class="btn" data-a="menu">Back</button></div>`);
  const a=$('#alb'),main=g;g=a.getContext('2d');
  for(let c=0;c<12;c++)for(let p=0;p<10;p++){
    const cx=p*54+27,cy=c*40+20,f={c,p,st:0,seed:c*131+p*17,wag:0,seg:Array.from({length:7},(_,i)=>[cx+17-i*LEN[0]/6,cy])};
    drawKoi(f,alb[c*10+p]!='1');
  }
  g=main;
}
function shopUI(){
  const nxt=over&&won;
  ui(`<div class="card"><h2>金 Luxury shop</h2><p>Treasury <b>${Math.floor(bank)} yen</b>: every coin you ever collect is banked here, plus 10% of a level's goal when you clear it. Equip up to <b>2</b> companions; they join the tank when a level starts or restarts.</p>
  ${LUX.map(l=>{const own=owned.includes(l.id),eq=loadout.includes(l.id);return `<div class="lx${eq?' eq':''}"><b>${l.k}</b><span><strong>${l.n}</strong><br><small>${l.d}</small></span>${own?`<button class="btn" data-a="e:${l.id}">${eq?'Equipped ✓':'Equip'}</button>`:`<button class="btn go" data-a="b:${l.id}" ${bank<l.p?'disabled':''}>${l.p}</button>`}</div>`}).join('')}
  <button class="btn go" data-a="${nxt?'next':'again'}">Start level ${nxt?lvl+1:lvl}${loadout.length?' with '+loadout.map(i=>LUX.find(l=>l.id==i).k).join(' + '):''}</button><button class="btn" data-a="menu">Back</button></div>`);
}
function buyLux(id){const l=LUX.find(x=>x.id==id);if(!l||owned.includes(id)||bank<l.p)return;bank-=l.p;owned.push(id);if(loadout.length<2)loadout.push(id);savePrefs();shopUI()}
function equipLux(id){if(!owned.includes(id))return;if(loadout.includes(id))loadout=loadout.filter(x=>x!=id);else{if(loadout.length>=2)loadout.shift();loadout.push(id)}savePrefs();shopUI()}
function menuHTML(){return `<button class="btn go" data-a="shop">金 Luxury shop · bank ${Math.floor(bank)}</button><div class="grid2" style="grid-template-columns:repeat(3,1fr)">${Array.from({length:Math.min(maxL,9)},(_,i)=>`<button class="btn${i+1==lvl?' on':''}" data-a="l${i+1}">Level ${i+1}</button>`).join('')}</div><button class="btn" data-a="album">鯉図鑑 Koi album ${alb.split('1').length-1}/120</button><p>Tap the water to drop food (2 yen each). Hungry koi eat it, grow, and drop coins: tap coins to collect. Spend yen on new koi (100, always a surprise colour and pattern) and upgrades. Tap monsters to fight them: 河童 kappa eats koi, 鯰 namazu swallows them, 蟹 crab steals coins.</p><button class="btn go" data-a="again">Restart level ${lvl}</button>`}
function act(a){if(a=='again')newLevel(lvl);else if(a=='next')newLevel(lvl+1);else if(a=='menu')openMenu();else if(a=='album')album();else if(a=='shop')shopUI();else if(a.startsWith('b:'))buyLux(a.slice(2));else if(a.startsWith('e:'))equipLux(a.slice(2));else if(a[0]=='l')newLevel(+a.slice(1))}
function saveGame(){
  put('kp-b',Math.floor(bank));
  if(over)return;
  put('kp-s',JSON.stringify({l:lvl,y:yen,e:earned,up,mt,lx:lux.map(u=>u.id),f:fish.filter(f=>!f.dead).map(f=>({c:f.c,p:f.p,st:f.st,eat:f.eat,hung:f.hung,x:f.x,y:f.y,a:f.a}))}));
}
function loadGame(){
  try{const s=JSON.parse(get('kp-s'));if(!s||!s.f||!s.f.length)return false;
    lvl=s.l;goal=3000*lvl;yen=s.y;earned=s.e;up=s.up;mt=s.mt;fish=[];food=[];coins=[];mons=[];fx=[];over=false;
    lux=(s.lx||[]).map(mkLux);
    s.f.forEach(o=>{const f=addFish(o.c,o.p,o.x,o.y,o.st,{hung:o.hung,a:o.a});f.eat=o.eat});hud();return true}catch(e){return false}
}
function onTheme(){const v=n=>css(n);pal={bg:v('--bg'),ink:v('--ink'),face:v('--face'),accent:v('--accent'),p1:v('--p1'),p3:v('--p3'),p5:v('--p5'),disp:v('--disp')}}
function fit(){const w=Math.floor(Math.min(innerWidth-20,(innerHeight-250)*W/H,520));cv.style.width=w+'px';cv.style.height=(w*H/W)+'px'}
function frame(ts){
  requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(!over&&!paused&&!$('#ov').classList.contains('show')){step(dt);if(Math.floor(t*4)!=Math.floor((t-dt)*4))hud()}
  draw();
}
document.addEventListener('visibilitychange',()=>{paused=document.hidden;if(document.hidden)saveGame()});
addEventListener('resize',fit);
function boot(){fit();if(!loadGame())newLevel(Math.min(lvl,maxL));requestAnimationFrame(frame)}

setTheme(document.documentElement.dataset.theme||'light');
if(typeof boot=='function')boot();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))</script>
