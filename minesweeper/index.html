<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<script>try{document.documentElement.dataset.theme=localStorage.getItem("ms-t")||"light"}catch(e){}</script>
<script>try{if(localStorage.getItem("dys")=="1")document.documentElement.setAttribute("data-dys","")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ui:"Zen Kaku Gothic New",sans-serif}
:root,[data-theme="light"]{--bg:#e6e0cf;--ink:#16283f;--face:#fbf7ea;--accent:#c23b2e;--edge:#16283f;--btn:#f3eedd;--wave:#2c5f8f;--waveo:.16;--p1:#2c5f8f;--p2:#c99a2e;--p3:#3f8f7f;--p4:#7a4a72;--p5:#5b6b7a;--gl:0;--disp:"Shippori Mincho",serif}
[data-theme="dark"]{--bg:#0b0820;--ink:#e8e4ff;--face:#0b0820;--accent:#ff2e9a;--edge:#ff2e9a;--btn:#14103a;--wave:#2de2e6;--waveo:.13;--p1:#1fb8bd;--p2:#9a4de0;--p3:#5fc43a;--p4:#e0b020;--p5:#3d64d8;--gl:10;--disp:"Zen Dots",sans-serif}
[data-theme="samurai"]{--bg:#0e0d0d;--ink:#ece3cf;--accent:#b3121c;--edge:#9aa3ab;--btn:#1b1818;--wave:#9aa3ab;--waveo:0.09;--pat:url(#sg);--disp:"Zen Antique",serif;--face:#ece3cf;--p1:#b3121c;--p2:#e6d9bd;--p3:#8f98a0;--p4:#6e1a1a;--p5:#5f6f80;--gl:0}
[data-theme="ninja"]{--bg:#090d0a;--ink:#dfe8e0;--accent:#2f8a55;--edge:#566a5c;--btn:#121a15;--wave:#6f8f78;--waveo:0.09;--pat:url(#sg);--disp:"Reggae One",serif;--face:#dfe8e0;--p1:#2f8a55;--p2:#8fd1a2;--p3:#6f8f78;--p4:#b7c6bb;--p5:#4d6a58;--gl:0}
[data-theme="geisha"]{--bg:#efd5d6;--ink:#3a1722;--face:#fbf4ef;--accent:#c4203c;--edge:#c99a2e;--btn:#fbf4ef;--wave:#c4203c;--waveo:.11;--p1:#6b3a8c;--p2:#d9798f;--p3:#b8851f;--p4:#3f8f8f;--p5:#8c4a6a;--gl:0;--disp:"Hina Mincho",serif}
[data-theme="kabuki"]{--bg:#f6e6b0;--ink:#151010;--accent:#d4112e;--edge:#151010;--btn:#fffaf0;--wave:#d4112e;--waveo:0.1;--pat:url(#kb);--disp:"Dela Gothic One",sans-serif;--face:#fffaf0;--p1:#d4112e;--p2:#f2c200;--p3:#2f8f3a;--p4:#151010;--p5:#ee7b1e;--gl:0}
[data-theme="dragon"]{--bg:#1a0606;--ink:#f6e7c8;--accent:#c8281e;--edge:#e0b040;--btn:#2a0d0c;--wave:#e0b040;--waveo:0.13;--pat:url(#ur);--disp:"Potta One",sans-serif;--face:#f6e7c8;--p1:#c8281e;--p2:#e0b040;--p3:#e8552b;--p4:#f2d98a;--p5:#8f1d17;--gl:4}
[data-theme="koi"]{--bg:#150e0a;--ink:#f7f1e6;--accent:#f26a1d;--edge:#f7f1e6;--btn:#251710;--wave:#8a5a2b;--waveo:0.16;--pat:url(#rp);--disp:"Yusei Magic",sans-serif;--face:#f7f1e6;--p1:#f26a1d;--p2:#f7f1e6;--p3:#17120f;--p4:#8a5a2b;--p5:#c98a4b;--gl:0}
[data-theme="imperial"]{--bg:#ede6f5;--ink:#2a1747;--accent:#6b3fa0;--edge:#c9a227;--btn:#fffdf8;--wave:#c9a227;--waveo:0.16;--pat:url(#ki);--disp:"Kaisei Tokumin",serif;--face:#fffdf8;--p1:#6b3fa0;--p2:#c9a227;--p3:#c8321f;--p4:#2f8f78;--p5:#3b4f9a;--gl:0}
[data-theme="kitsune"]{--bg:#05061a;--ink:#dfe6ff;--accent:#4a5cff;--edge:#7a6cff;--btn:#0d1033;--wave:#5b6cff;--waveo:0.13;--pat:url(#fx);--disp:"Kiwi Maru",serif;--face:#dfe6ff;--p1:#4a5cff;--p2:#a34dff;--p3:#2a2f8f;--p4:#7a6cff;--p5:#dfe6ff;--gl:10}
@font-face{font-family:"OpenDyslexic";font-style:normal;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@5/latin-400-normal.woff2) format("woff2"),url(https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@5/latin-400-normal.woff) format("woff")}
@font-face{font-family:"OpenDyslexic";font-style:normal;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@5/latin-700-normal.woff2) format("woff2"),url(https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@5/latin-700-normal.woff) format("woff")}
:root[data-dys][data-theme]{--ui:"OpenDyslexic","Zen Kaku Gothic New",sans-serif;--disp:"OpenDyslexic","Zen Kaku Gothic New",sans-serif;--num:"OpenDyslexic","Zen Kaku Gothic New",sans-serif}
.dysbtn{flex:none;width:34px;height:34px;border:2px solid var(--ink);border-radius:50%;background:transparent;color:var(--ink);font:800 13px var(--ui);padding:0}
.dysbtn.on{background:var(--ink);color:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:root{--panel:color-mix(in srgb,var(--bg) 82%,var(--ink))}
.bg{position:fixed;inset:0;width:100%;height:100%;color:var(--wave);opacity:var(--waveo);pointer-events:none}
.bg rect{fill:var(--pat,url(#sg))}
.app{position:relative;height:100%;max-width:640px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px;font:700 13px var(--ui)}
.top h1{margin:0;font:800 21px var(--disp);text-shadow:0 0 calc(var(--gl)*1px) var(--accent)}
.top .st{margin-left:auto;text-align:right;line-height:1.25}
.btn,select{border:2px solid var(--ink);background:var(--btn);color:var(--ink);font:700 14px var(--ui);border-radius:10px;padding:9px 8px}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--face)}
.btn.on{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4}
button:active{transform:scale(.97)}
.stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.ov{position:fixed;inset:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(4px);display:none;place-items:center;padding:14px}
.ov.show{display:grid}
.card{width:min(420px,100%);max-height:94dvh;overflow:auto;background:var(--bg);border:3px solid var(--edge);padding:16px;text-align:center;display:grid;gap:9px}
.card h2{margin:0;font:800 26px var(--disp);color:var(--accent);text-shadow:0 0 calc(var(--gl)*1px) var(--accent)}
.card p{margin:0;opacity:.85;font-size:14px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;font:700 13px var(--ui)}
.seg{display:flex;border:2px solid var(--ink);border-radius:18px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:700 13px var(--ui);padding:5px 12px}
.seg button.on{background:var(--ink);color:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:16px;font:700 13px var(--ui);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90%;text-align:center}#toast.show{opacity:1}
@keyframes pl{to{filter:brightness(1.45)}}

#mf{display:grid;gap:2px;background:var(--edge);border:3px solid var(--edge);padding:2px;touch-action:manipulation}
.m{aspect-ratio:1;display:grid;place-items:center;font:800 calc(var(--cs)*.56)/1 var(--disp);color:var(--ink);border-radius:4px;cursor:pointer;min-width:0}
.m.u{background:var(--p1);box-shadow:inset 0 -3px 0 #0003,inset 0 3px 0 #fff3}
.m.r{background:var(--bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 15%,transparent)}
.m.f{color:var(--face)}
.m.x{background:var(--accent);color:var(--face)}
.m.w{background:color-mix(in srgb,var(--accent) 35%,var(--bg))}
.m.hl{outline:3px dashed var(--accent);outline-offset:-3px;animation:pl .5s infinite alternate}

</style>
</head>
<body>
<svg class="bg" aria-hidden="true"><defs><pattern id="sg" width="44" height="22" patternUnits="userSpaceOnUse"><g fill="var(--bg)" stroke="currentColor" stroke-width="1.2"><g id="sc"><circle cx="0" cy="11" r="22"/><circle cx="0" cy="11" r="16.5"/><circle cx="0" cy="11" r="11"/><circle cx="0" cy="11" r="5.5"/></g><use href="#sc" x="44"/><use href="#sc" x="22" y="11"/></g></pattern><pattern id="kb" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="20" height="60" fill="#d4112e"/><rect x="20" width="20" height="60" fill="#f2c200"/><rect x="40" width="20" height="60" fill="#151010"/></pattern><pattern id="ur" width="36" height="31" patternUnits="userSpaceOnUse"><path d="M0 31L18 0L36 31ZM-18 0L0 31M36 31L54 0" fill="none" stroke="currentColor" stroke-width="1.4"/></pattern><pattern id="rp" width="70" height="70" patternUnits="userSpaceOnUse"><g fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="20" cy="20" r="6"/><circle cx="20" cy="20" r="13"/><circle cx="20" cy="20" r="20"/><circle cx="52" cy="52" r="5"/><circle cx="52" cy="52" r="11"/></g></pattern><g id="kk" fill="none" stroke="currentColor" stroke-width="1.1"><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(0)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(30)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(60)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(90)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(120)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(150)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(180)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(210)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(240)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(270)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(300)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(330)"/></g><pattern id="ki" width="56" height="56" patternUnits="userSpaceOnUse"><use href="#kk" x="14" y="14"/><use href="#kk" transform="translate(42 42) scale(.7)"/></pattern><pattern id="fx" width="48" height="48" patternUnits="userSpaceOnUse"><g fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 5C18 12 19 19 12 26C5 19 6 12 12 5Z"/><path d="M36 26C42 33 43 40 36 47C29 40 30 33 36 26Z"/><path d="M12 14C14 17 14 20 12 22"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#sg)"/></svg>
<div class="app">
  <div class="top"><h1>鬼払い</h1><span class="st" id="info"></span><button id="bm" class="dysbtn" aria-label="Menu">☰</button></div>
  <div class="stage"><div id="mf"></div></div>
  <div class="bar"><button class="btn" id="fl">旗 Flag mode: off</button><button class="btn" id="hint">示 Hint</button></div>
</div>
<div class="ov" id="ov"></div>
<div id="toast"></div>
<script>
const TITLE="鬼払い Oni-harai Minesweeper",KEY="ms";
const $=s=>document.querySelector(s);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const TH=[['light','Woodblock 浮世絵','#e6e0cf'],['dark','Neon ネオン','#0b0820'],['samurai','Samurai 侍','#0e0d0d'],['ninja','Ninja 忍','#090d0a'],['geisha','Geisha 芸者','#efd5d6'],['kabuki','Kabuki 歌舞伎','#f6e6b0'],['dragon','Dragon 龍','#1a0606'],['koi','Koi 鯉','#150e0a'],['imperial','Imperial 皇室','#ede6f5'],['kitsune','Kitsune 狐','#05061a']];
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.random()*n|0;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=t=>(t/60|0)+':'+String(t%60).padStart(2,'0');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function setTheme(t){
  document.documentElement.dataset.theme=t;put(KEY+'-t',t);
  document.querySelector('meta[name=theme-color]').content=(TH.find(x=>x[0]==t)||TH[0])[2];
  if(typeof onTheme=='function')onTheme();
}
function toggleDys(){
  const on=!document.documentElement.hasAttribute('data-dys');
  document.documentElement.toggleAttribute('data-dys',on);put('dys',on?'1':'0');
  (document.fonts&&document.fonts.load('16px OpenDyslexic')||Promise.resolve()).catch(()=>{}).then(()=>setTheme(document.documentElement.dataset.theme));
}
const dysLabel=()=>'Dyslexia font: '+(document.documentElement.hasAttribute('data-dys')?'On':'Off');
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),ms||2400)}
function ui(h){const o=$('#ov');o.innerHTML=h;o.classList.add('show')}
function hideUi(){$('#ov').classList.remove('show')}
function openMenu(){
  ui(`<div class="card"><h2>${TITLE}</h2>${typeof menuHTML=='function'?menuHTML():''}<select id="th" aria-label="Style">${TH.map(t=>`<option value="${t[0]}"${document.documentElement.dataset.theme==t[0]?' selected':''}>${t[1]}</option>`).join('')}</select><button class="btn" data-a="dys">${dysLabel()}</button><button class="btn" data-a="close">Close</button></div>`);
}
$('#ov').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(!a)return;
  if(a=='close')hideUi();else if(a=='dys'){toggleDys();openMenu()}else if(typeof act=='function')act(a,b);
};
$('#ov').onchange=e=>{if(e.target.id=='th')setTheme(e.target.value)};
$('#bm').onclick=openMenu;


const LV=[['Easy',9,9,10],['Medium',12,16,30],['Hard',14,20,56]];
let lv=+get('ms-l')||0,W=9,H=9,M=10,cells=[],first=true,over=false,flags=0,rev=0,sec=0,tm=null,fm=false,cs=34,lp=null,lpd=false;
const NC=['','--p1','--p3','--accent','--p4','--p2','--p5','--ink','--ink'];
function nb(i){const x=i%W,y=i/W|0,o=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const X=x+dx,Y=y+dy;if(X>=0&&X<W&&Y>=0&&Y<H)o.push(Y*W+X)}return o}
function newGame(l){
  lv=l;put('ms-l',l);[,W,H,M]=LV[l];cells=Array.from({length:W*H},()=>({m:0,a:0,r:0,f:0}));
  first=true;over=false;flags=0;rev=0;sec=0;clearInterval(tm);hideUi();fit();render();
}
function fit(){cs=Math.floor(Math.min((innerWidth-30)/W,(innerHeight-200)/H,44));const s=document.documentElement.style;s.setProperty('--cs',cs+'px')}
function seed(safe){
  const ban=new Set([safe,...nb(safe)]);let n=0;
  while(n<M){const i=rnd(W*H);if(ban.has(i)||cells[i].m)continue;cells[i].m=1;n++}
  cells.forEach((c,i)=>c.a=nb(i).filter(j=>cells[j].m).length);
}
function reveal(i){
  const c=cells[i];if(c.r||c.f||over)return;
  if(first){first=false;seed(i);tm=setInterval(()=>{if(!over&&!document.hidden){sec++;hud()}},1000)}
  const st=[i];
  while(st.length){
    const j=st.pop(),d=cells[j];if(d.r||d.f)continue;
    d.r=1;rev++;
    if(d.m){lose(j);return}
    if(!d.a)nb(j).forEach(k=>{if(!cells[k].r&&!cells[k].f)st.push(k)});
  }
  if(rev==W*H-M)win();
}
function chord(i){const c=cells[i];if(!c.r||!c.a)return;const n=nb(i);if(n.filter(j=>cells[j].f).length!=c.a)return;n.forEach(j=>reveal(j))}
function flag(i){const c=cells[i];if(c.r||over)return;c.f=!c.f;flags+=c.f?1:-1}
function lose(j){over=true;clearInterval(tm);cells.forEach((c,i)=>{if(c.m)c.r=1});cells[j].boom=1;render();setTimeout(()=>ui(`<div class="card"><h2>Oni got you</h2><p>${rev-M>0?'':''}Better luck next time.</p><button class="btn go" data-a="again">New game</button><button class="btn" data-a="menu">Menu</button></div>`),700)}
function win(){
  over=true;clearInterval(tm);const k='ms-b'+lv,b=+get(k)||0,nb2=!b||sec<b;if(nb2)put(k,sec);
  cells.forEach(c=>{if(c.m)c.f=1});flags=M;render();
  setTimeout(()=>ui(`<div class="card"><h2>Oni banished!</h2><p>${LV[lv][0]} · ${fmt(sec)}${nb2?' · new best!':' · best '+fmt(b)}</p><button class="btn go" data-a="again">Play again</button><button class="btn" data-a="menu">Menu</button></div>`),500);
}
function hud(){$('#info').innerHTML=`鬼 ${M-flags}<br>${fmt(sec)}`}
function render(){
  const f=$('#mf');f.style.gridTemplateColumns=`repeat(${W},var(--cs))`;
  let h='';
  for(let i=0;i<W*H;i++){
    const c=cells[i];let k='m ',t='';
    if(c.r){k+='r';if(c.m){k+=c.boom?' x':'';t='鬼'}else if(c.a)t=`<span style="color:var(${NC[c.a]})">${c.a}</span>`}
    else{k+='u';if(c.f){k+=' f';t='旗';if(over&&!c.m)k+=' w'}}
    h+=`<div class="${k}" data-i="${i}">${t}</div>`;
  }
  f.innerHTML=h;hud();
}
function pressStart(e){
  const c=e.target.closest('.m');if(!c||over)return;lpd=false;const i=+c.dataset.i;
  lp=setTimeout(()=>{lpd=true;flag(i);render();navigator.vibrate&&navigator.vibrate(15)},420);
}
function pressEnd(e){
  clearTimeout(lp);const c=e.target.closest('.m');if(!c||lpd||over)return;const i=+c.dataset.i,d=cells[i];
  if(d.r)chord(i);else if(fm)flag(i);else reveal(i);
  if(!over)render();
}
$('#mf').addEventListener('pointerdown',pressStart);
$('#mf').addEventListener('pointerup',pressEnd);
$('#mf').addEventListener('pointerleave',()=>clearTimeout(lp));
$('#mf').addEventListener('contextmenu',e=>{e.preventDefault();const c=e.target.closest('.m');if(c&&!over){flag(+c.dataset.i);render()}});
$('#fl').onclick=()=>{fm=!fm;$('#fl').textContent='旗 Flag mode: '+(fm?'on':'off');$('#fl').classList.toggle('on',fm)};
function safeMove(){
  for(let i=0;i<W*H;i++){
    const c=cells[i];if(!c.r||!c.a)continue;
    const n=nb(i),un=n.filter(j=>!cells[j].r),fl=un.filter(j=>cells[j].f);
    if(fl.length==c.a){const s=un.find(j=>!cells[j].f);if(s!==undefined)return{i:s,safe:1}}
    if(un.length==c.a){const m=un.find(j=>!cells[j].f);if(m!==undefined)return{i:m,safe:0}}
  }
  return null;
}
$('#hint').onclick=()=>{
  if(over||first){toast(first?'Tap any square to start':'');return}
  const h=safeMove();if(!h){toast('No certain move right now');return}
  const el=$('#mf').children[h.i];el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),2500);
  toast(h.safe?'The highlighted square is safe':'The highlighted square holds an oni, flag it');
};
function menuHTML(){return `<div class="grid2">${LV.map((l,i)=>`<button class="btn${i==lv?' on':''}" data-a="lv${i}">${l[0]}<br><small>${l[1]}×${l[2]} · ${l[3]} oni${+get('ms-b'+i)?' · '+fmt(+get('ms-b'+i)):''}</small></button>`).join('')}</div><p>Tap to reveal, long-press (or Flag mode) to flag. Tap a number to clear around it once its flags match.</p>`}
function act(a){if(a=='again')newGame(lv);else if(a=='menu')openMenu();else if(a.startsWith('lv'))newGame(+a[2])}
