ale(.7)"/></pattern><pattern id="fx" width="48" height="48" patternUnits="userSpaceOnUse"><g fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 5C18 12 19 19 12 26C5 19 6 12 12 5Z"/><path d="M36 26C42 33 43 40 36 47C29 40 30 33 36 26Z"/><path d="M12 14C14 17 14 20 12 22"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#sg)"/></svg>

<script>
const TITLE="絵 Picross",KEY="pc";
const $=s=>document.querySelector(s);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const TH=[['light','Woodblock 浮世絵','#e6e0cf'],['dark','Neon ネオン','#0b0820'],['samurai','Samurai 侍','#0e0d0d'],['ninja','Ninja 忍','#090d0a'],['geisha','Geisha 芸者','#efd5d6'],['kabuki','Kabuki 歌舞伎','#f6e6b0'],['dragon','Dragon 龍','#1a0606'],['koi','Koi 鯉','#150e0a'],['imperial','Imperial 皇室','#ede6f5'],['kitsune','Kitsune 狐','#05061a']];
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.random()*n|0;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=t=>(t/60|0)+':'+String(t%60).padStart(2,'0');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function setTheme(t){
  document.documentElement.dataset.theme=t;put(KEY+'-t',t);
  document.querySelector('meta[name=theme-color]').content=(TH.find(x=>x[0]==t)||TH[0])[2];
  if(typeof onTheme=='function')onTheme();
}
function toggleDys(){
  const on=!document.documentElement.hasAttribute('data-dys');
  document.documentElement.toggleAttribute('data-dys',on);put('dys',on?'1':'0');
  (document.fonts&&document.fonts.load('16px OpenDyslexic')||Promise.resolve()).catch(()=>{}).then(()=>setTheme(document.documentElement.dataset.theme));
}
const dysLabel=()=>'Dyslexia font: '+(document.documentElement.hasAttribute('data-dys')?'On':'Off');
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),ms||2400)}
function ui(h){const o=$('#ov');o.innerHTML=h;o.classList.add('show')}
function hideUi(){$('#ov').classList.remove('show')}
function openMenu(){
  ui(`<div class="card"><h2>${TITLE}</h2>${typeof menuHTML=='function'?menuHTML():''}<select id="th" aria-label="Style">${TH.map(t=>`<option value="${t[0]}"${document.documentElement.dataset.theme==t[0]?' selected':''}>${t[1]}</option>`).join('')}</select><button class="btn" data-a="dys">${dysLabel()}</button><button class="btn" data-a="close">Close</button></div>`);
}
$('#ov').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(!a)return;
  if(a=='close')hideUi();else if(a=='dys'){toggleDys();openMenu()}else if(typeof act=='function')act(a,b);
};
$('#ov').onchange=e=>{if(e.target.id=='th')setTheme(e.target.value)};
$('#bm').onclick=openMenu;


const PIC=[
 ['Sun','日',(u,v)=>(u-5)**2+(v-5)**2<=16],
 ['Moon','月',(u,v)=>(u-5)**2+(v-5)**2<=17&&(u-6.5)**2+(v-4)**2>11],
 ['Fuji','富',(u,v)=>v>2.2&&Math.abs(u-5)<=(v-2)*.62],
 ['Torii','門',(u,v)=>v<1.7||(v>=2.6&&v<3.7&&u>1&&u<9)||((u>1.7&&u<3||u>7&&u<8.3)&&v>=1.7)],
 ['Lantern','灯',(u,v)=>((u-5)/3)**2+((v-5)/3.8)**2<=1||(v<1&&u>3.4&&u<6.6)||(v>9&&u>3.4&&u<6.6)],
 ['Koi','鯉',(u,v)=>((u-4.2)/3.7)**2+((v-5)/2.4)**2<=1||(u>7.5&&Math.abs(v-5)<(u-7)*1.5)],
 ['Wave','波',(u,v)=>v>5.4+1.8*Math.sin(u*.95)],
 ['Blossom','桜',(u,v)=>[[5,2.5],[7.6,4.3],[6.6,7.5],[3.4,7.5],[2.4,4.3]].some(p=>(u-p[0])**2+(v-p[1])**2<=4.2)||(u-5)**2+(v-5)**2<=1.6],
 ['Diamond','菱',(u,v)=>Math.abs(u-5)+Math.abs(v-5)<=4.4],
 ['Bamboo','竹',(u,v)=>(u>=4&&u<6)||((v>2&&v<3.2||v>6&&v<7.2)&&u>=2&&u<8)]
];
const OK=[[0, 5], [2, 5], [3, 5], [4, 5], [5, 5], [6, 5], [7, 5], [8, 5], [9, 5], [0, 10], [2, 10], [3, 10], [4, 10], [5, 10], [6, 10], [7, 10], [8, 10], [9, 10], [0, 15], [2, 15], [3, 15], [4, 15], [5, 15], [6, 15], [7, 15], [8, 15], [9, 15]];
const runs=l=>{const r=[];let n=0;for(const v of l){if(v==1)n++;else if(n){r.push(n);n=0}}if(n)r.push(n);return r};
function lineSolve(cl,line){
  const n=line.length,a0=Array(n).fill(0),a1=Array(n).fill(0),cur=Array(n).fill(0);let ok=0;
  (function rec(b,p){
    if(b==cl.length){for(let i=p;i<n;i++)if(line[i]==1)return;for(let i=p;i<n;i++)cur[i]=0;ok=1;for(let i=0;i<n;i++)cur[i]?a1[i]=1:a0[i]=1;return}
    const rest=cl.slice(b+1).reduce((s,x)=>s+x+1,0);
    for(let s=p;s+cl[b]+rest<=n;s++){
      if(s>p&&line[s-1]==1)break;
      let good=true;for(let i=s;i<s+cl[b];i++)if(line[i]==0){good=false;break}
      if(good&&s+cl[b]<n&&line[s+cl[b]]==1)good=false;
      if(!good)continue;
      for(let i=p;i<s;i++)cur[i]=0;for(let i=s;i<s+cl[b];i++)cur[i]=1;if(s+cl[b]<n)cur[s+cl[b]]=0;
      rec(b+1,Math.min(n,s+cl[b]+1));
    }
  })(0,0);
  if(!ok)return null;
  return line.map((v,i)=>v>=0?v:(a1[i]&&!a0[i]?1:a0[i]&&!a1[i]?0:-1));
}
function cluesOf(g,n){const rows=[],cols=[];for(let y=0;y<n;y++)rows.push(runs(g.slice(y*n,y*n+n)));for(let x=0;x<n;x++)cols.push(runs(Array.from({length:n},(_,y)=>g[y*n+x])));return{rows,cols}}
function logicSolvable(g,n){
  const{rows,cols}=cluesOf(g,n),k=Array(n*n).fill(-1);let ch=true;
  while(ch){ch=false;
    for(let y=0;y<n;y++){const r=lineSolve(rows[y],k.slice(y*n,y*n+n));if(!r)return false;r.forEach((v,x)=>{if(k[y*n+x]!=v){k[y*n+x]=v;ch=true}})}
    for(let x=0;x<n;x++){const r=lineSolve(cols[x],Array.from({length:n},(_,y)=>k[y*n+x]));if(!r)return false;r.forEach((v,y)=>{if(k[y*n+x]!=v){k[y*n+x]=v;ch=true}})}
  }
  return k.every(v=>v>=0);
}
const pic=(i,n)=>{const g=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++)g.push(PIC[i][2]((x+.5)*10/n,(y+.5)*10/n)?1:0);return g};
function randomPuzzle(n){for(let t=0;t<400;t++){const g=Array.from({length:n*n},()=>Math.random()<(n<8?.62:.55)?1:0);if(g.every(v=>!v))continue;if(logicSolvable(g,n))return g}return pic(0,n)}
let P=null,u=[],n=10,cs=30,sec=0,tm=null,done=false,tool=0,paint=null,prog={};
try{prog=JSON.parse(get('pc-p'))||{}}catch(e){}
function load(spec){
  P=spec;n=spec.n;u=Array(n*n).fill(0);done=false;sec=0;clearInterval(tm);
  tm=setInterval(()=>{if(!done&&!document.hidden){sec++;hud()}},1000);
  const c=cluesOf(P.g,n);P.rows=c.rows;P.cols=c.cols;hideUi();render();
}
function fit(){
  const mr=Math.max(...P.rows.map(r=>r.length)),mc=Math.max(...P.cols.map(r=>r.length));
  cs=Math.floor(Math.min((innerWidth-24)/(n+mr*.6),(innerHeight-220)/(n+mc*.55),46));
  document.documentElement.style.setProperty('--cs',cs+'px');
}
function render(){
  fit();const g=$('#pg');g.style.gridTemplateColumns=`auto repeat(${n},var(--cs))`;
  const rs=rowsOk(),cl=colsOk();let h='<div></div>';
  for(let x=0;x<n;x++)h+=`<div class="cc">${P.cols[x].length?P.cols[x].map(v=>`<span class="${cl[x]?'ok':''}">${v}</span>`).join(''):`<span class="${cl[x]?'ok':''}">0</span>`}</div>`;
  for(let y=0;y<n;y++){
    h+=`<div class="rc">${P.rows[y].length?P.rows[y].map(v=>`<span class="${rs[y]?'ok':''}">${v}</span>`).join(''):`<span class="${rs[y]?'ok':''}">0</span>`}</div>`;
    for(let x=0;x<n;x++){const i=y*n+x,s=u[i];h+=`<div class="pc${s==1?(done?' f win':' f'):''}${(x+1)%5==0&&x<n-1?' r5':''}${(y+1)%5==0&&y<n-1?' b5':''}" data-i="${i}">${s==2?'×':''}</div>`}
  }
  g.innerHTML=h;hud();
}
const same=(a,b)=>a.length==b.length&&a.every((v,i)=>v==b[i]);
const rowsOk=()=>P.rows.map((c,y)=>same(runs(u.slice(y*n,y*n+n)),c));
const colsOk=()=>P.cols.map((c,x)=>same(runs(Array.from({length:n},(_,y)=>u[y*n+x])),c));
function solved(){return rowsOk().every(Boolean)&&colsOk().every(Boolean)}
function hud(){$('#info').innerHTML=`${P.name}<br>${n}×${n} · ${fmt(sec)}`}
function applyCell(i){
  const s=u[i];
  if(paint==null)paint=tool?(s==2?0:2):(s==1?0:1);
  if(tool&&s==1)return false;
  if(u[i]==paint)return false;
  u[i]=paint;return true;
}
function endPaint(){
  if(paint==null)return;paint=null;render();
  if(!done&&solved()){
    done=true;clearInterval(tm);const k=P.id,b=prog[k],nw=!b||sec<b;if(nw){prog[k]=sec;put('pc-p',JSON.stringify(prog))}
    render();setTimeout(()=>ui(`<div class="card"><h2>${P.kan||'絵'} ${P.name}</h2><p>Solved in ${fmt(sec)}${nw?' · new best!':''}</p><button class="btn go" data-a="next">Next puzzle</button><button class="btn" data-a="menu">Puzzle list</button></div>`),500);
  }
}
const cellAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.classList&&el.classList.contains('pc')?el:null};
$('#pg').addEventListener('pointerdown',e=>{if(done)return;const el=e.target.closest('.pc');if(!el)return;paint=null;const i=+el.dataset.i;if(applyCell(i)){el.classList.toggle('f',u[i]==1);el.textContent=u[i]==2?'×':''}});
$('#pg').addEventListener('pointermove',e=>{if(paint==null||done)return;const el=cellAt(e);if(!el)return;const i=+el.dataset.i;if(applyCell(i)){el.classList.toggle('f',u[i]==1);el.textContent=u[i]==2?'×':''}});
addEventListener('pointerup',endPaint);addEventListener('pointercancel',endPaint);
$('#tool').onclick=()=>{tool=tool?0:1;$('#tool').textContent=tool?'× Mark':'■ Fill';$('#tool').classList.toggle('on',!!tool)};
$('#clr').onclick=()=>{if(done)return;u=Array(n*n).fill(0);render()};
let cur=-1;
function spec(i,sz){return{id:i+'-'+sz,g:pic(i,sz),n:sz,name:PIC[i][0],kan:PIC[i][1]}}
function nextSpec(){
  const todo=OK.filter(o=>!prog[o[0]+'-'+o[1]]);const o=(todo.length?todo:OK)[todo.length?0:rnd(OK.length)];return spec(o[0],o[1]);
}
function menuHTML(){
  return `<p>Fill the squares so each row and column matches its number clues. Tap or drag to fill, switch to Mark to cross out squares. A greyed clue means that line is done.</p>
  <div class="grid2" style="grid-template-columns:repeat(3,1fr)">${[5,10,15].map(s=>`<button class="btn" data-a="r${s}">Random ${s}×${s}</button>`).join('')}</div>
  <div class="grid2" style="grid-template-columns:repeat(3,1fr);max-height:34vh;overflow:auto">${OK.map(o=>`<button class="btn${prog[o[0]+'-'+o[1]]?' on':''}" data-a="p${o[0]}-${o[1]}">${PIC[o[0]][1]} ${o[1]}${prog[o[0]+'-'+o[1]]?' ✓':''}</button>`).join('')}</div>`;
}
function act(a){
  if(a=='next')load(nextSpec());else if(a=='menu')openMenu();
  else if(a[0]=='r'){const s=+a.slice(1);load({id:'r'+s+'-'+Date.now(),g:randomPuzzle(s),n:s,name:'Random',kan:'絵'})}
  else if(a[0]=='p'){const[i,s]=a.slice(1).split('-').map(Number);load(spec(i,s))}
}
addEventListener('resize',()=>P&&render());
function boot(){load(nextSpec())}

setTheme(document.documentElement.dataset.theme||'light');
if(typeof boot=='function')boot();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))</script>
</body>
</html>
