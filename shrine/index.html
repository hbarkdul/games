 ['asc1','昇','Ascension','Ascend for the first time',()=>G.asc>=1],['asc5','神','Divine','Ascend 5 times',()=>G.asc>=5],['upg','買','Improver','Buy 8 upgrades in one run',()=>Object.keys(G.upg).length>=8]];
const fresh=()=>({mon:0,run:0,life:0,clicks:0,gens:GEN.map(()=>0),upg:{},pts:0,asc:0,koi:0,ach:{},fz:0,fm:1,cf:0,t:Date.now(),born:Date.now(),koiAt:0});
let G=fresh(),tab='gen',buy=1,rows=[],lastT=Date.now(),saveT=0,uiT=0,kT=0;
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function nf(n){
  if(!isFinite(n))return '∞';if(n<1000)return n<10?(Math.round(n*10)/10).toString():Math.floor(n).toString();
  const e=Math.floor(Math.log10(n)/3);if(e>=SUF.length)return n.toExponential(2).replace('+','');
  const v=n/Math.pow(1000,e);return(v<10?v.toFixed(2):v<100?v.toFixed(1):v.toFixed(0))+SUF[e];
}
const gift=n=>G.pts>=GIFTS[n][0];
const gmult=i=>{let m=1;for(const k of MS)if(G.gens[i]>=k)m*=2;return m};
const allMult=()=>{let m=(1+.03*G.pts)*(1+.01*Object.keys(G.ach).length);for(const u of UPG)if(G.upg[u.id]&&u.t=='all')m*=u.v;return m};
function mps(){let s=0;for(let i=0;i<GEN.length;i++)s+=G.gens[i]*GEN[i][3]*gmult(i);return s*allMult()*(Date.now()<G.fz?G.fm:1)}
function clickVal(){let c=1,p=0;for(const u of UPG)if(G.upg[u.id]){if(u.t=='click')c*=u.v;if(u.t=='pct')p+=u.v}return(c+mps()*p)*(1+.03*G.pts)*(Date.now()<G.cf?50:1)}
const disc=()=>gift(3)?.95:1;
function cost(i,n){const b=GEN[i][2]*Math.pow(GR,G.gens[i]);return b*(Math.pow(GR,n)-1)/(GR-1)*disc()}
function maxBuy(i){const b=GEN[i][2]*Math.pow(GR,G.gens[i])*disc();return Math.max(0,Math.floor(Math.log(G.mon*(GR-1)/b+1)/Math.log(GR)))}
const amt=i=>buy=='max'?Math.max(1,maxBuy(i)):buy;
function earn(v){G.mon+=v;G.run+=v;G.life+=v}
function ring(e){
  const v=clickVal();earn(v);G.clicks++;
  const b=$('#bell');b.classList.add('rg');setTimeout(()=>b.classList.remove('rg'),70);
  const q=$('#idle').getBoundingClientRect(),r=e&&e.clientX!=null?{x:e.clientX-q.left,y:e.clientY-q.top}:{x:q.width/2,y:150};
  const f=document.createElement('span');f.className='fl';f.textContent='+'+nf(v);f.style.left=(r.x-14)+'px';f.style.top=(r.y-26)+'px';$('#idle').appendChild(f);setTimeout(()=>f.remove&&f.remove(),1000);
  checkAch();
}
function buyGen(i){const n=amt(i),c=cost(i,n);if(G.mon>=c&&n>0){G.mon-=c;G.gens[i]+=n;checkAch();draw(true)}}
function buyUpg(id){const u=UPG.find(x=>x.id==id);if(!u||G.upg[id]||G.mon<u.cost)return;G.mon-=u.cost;G.upg[id]=1;checkAch();draw(true)}
function claimable(){return Math.max(0,Math.floor(Math.sqrt(G.life/1e6))-G.pts)}
function ascend(){
  const c=claimable();if(c<1)return;
  G.pts+=c;G.asc++;G.mon=gift(4)?1e4:0;G.run=0;G.gens=GEN.map(()=>0);G.upg={};G.fz=G.cf=0;checkAch();save();hideUi();draw(true);
}
function checkAch(){let n=0;for(const a of ACH)if(!G.ach[a[0]]&&a[4]()){G.ach[a[0]]=Date.now();n++;toast('実績 '+a[2]+' · +1% production',3200)}return n}
/* ---------- lucky koi ---------- */
let koiTimer=0;
function scheduleKoi(){clearTimeout(koiTimer);const base=(60+rnd(90))*(gift(1)?.5:1);koiTimer=setTimeout(spawnKoi,base*1000)}
function spawnKoi(){
  const k=$('#koi');k.style.top=(20+rnd(45))+'%';k.style.display='block';k.style.animation='none';void k.offsetWidth;k.style.animation='swim 14s linear forwards';
  clearTimeout(spawnKoi.h);spawnKoi.h=setTimeout(()=>{k.style.display='none';scheduleKoi()},14000);
}
function catchKoi(){
  const k=$('#koi');k.style.display='none';clearTimeout(spawnKoi.h);G.koi++;
  const r=Math.random(),m=mps();
  if(r<.5){G.fz=Date.now()+30000;G.fm=7;toast('Lucky koi: production ×7 for 30 seconds!',3500)}
  else if(r<.85){const v=Math.max(13,m*900);earn(v);toast('Lucky koi: '+nf(v)+' Mon (15 minutes of income)!',3500)}
  else{G.cf=Date.now()+15000;toast('Lucky koi: bell rings ×50 for 15 seconds!',3500)}
  checkAch();scheduleKoi();draw(true);
}
$('#koi').addEventListener('pointerdown',catchKoi);
/* ---------- save, offline, tick ---------- */
function pack(){G.t=Date.now();return btoa(unescape(encodeURIComponent(JSON.stringify(G))))}
function unpack(s){return JSON.parse(decodeURIComponent(escape(atob(s.trim()))))}
function save(){try{localStorage.setItem('sk-s',pack())}catch(e){}}
function load(){
  try{const s=localStorage.getItem('sk-s');if(s){const o=unpack(s);G=Object.assign(fresh(),o);G.gens=GEN.map((_,i)=>o.gens&&o.gens[i]||0)}}catch(e){G=fresh()}
  const el=Math.max(0,(Date.now()-G.t)/1000);if(el>60)offline(el,true);
}
function offline(el,show){
  const cap=gift(0)?86400:28800,eff=gift(0)?1:.5,e=Math.min(el,cap),v=mps()*e*eff;
  if(v>0){earn(v);if(show)ui(`<div class="card"><h2>Welcome back</h2><p>The shrine kept working for ${e>=3600?(e/3600).toFixed(1)+' hours':Math.round(e/60)+' minutes'} (${gift(0)?'full':'half'} speed): <b>+${nf(v)} Mon</b></p><button class="btn go" data-a="close">Thank you</button></div>`)}
}
function tick(){
  const now=Date.now(),el=(now-lastT)/1000;lastT=now;
  if(el>5)offline(el,true);else{const m=mps();earn(m*el);if(gift(2))earn(clickVal()*3*el)}
  if((uiT+=el)>=.25){uiT=0;draw(false);checkAch()}
  if((kT+=el)>=2){kT=0;if(tab=='kami'||tab=='ach')build()}
  if((saveT+=el)>=5){saveT=0;save()}
}
/* ---------- drawing ---------- */
function build(){
  const p=$('#panel');p.innerHTML='';rows=[];
  if(tab=='gen'){
    p.insertAdjacentHTML('beforeend','<div class="bulk">'+[1,10,100,'max'].map(b=>`<button class="btn${buy==b?' on':''}" data-b="${b}">${b=='max'?'Max':'×'+b}</button>`).join('')+'</div>');
    GEN.forEach((g,i)=>{const d=document.createElement('div');d.className='gr';d.dataset.i=i;d.innerHTML=`<b>${g[0]}</b><span><strong>${g[1]}</strong><i class="own"></i><br><small class="rt"></small></span><button class="btn bt"><span class="ct"></span></button>`;p.appendChild(d);rows.push(d)});
  }else if(tab=='upg'){
    const list=UPG.filter(u=>!G.upg[u.id]).sort((a,b)=>a.cost-b.cost).slice(0,6);
    if(!list.length)p.innerHTML='<div class="gr done"><span>Every upgrade bought this run.</span></div>';
    list.forEach(u=>{const d=document.createElement('div');d.className='gr';d.dataset.u=u.id;d.innerHTML=`<b>${u.t=='all'?'倍':u.t=='click'?'鈴':'祈'}</b><span><strong>${u.n}</strong><br><small>${u.d}</small></span><button class="btn bt"><span class="ct">${nf(u.cost)} Mon</span></button>`;p.appendChild(d);rows.push(d)});
  }else if(tab=='kami'){
    const c=claimable(),nextP=Math.pow(G.pts+c+1,2)*1e6;
    p.innerHTML=`<div class="gr"><b>昇</b><span><strong>Ascend</strong><br><small>Reset your Mon, attendants and upgrades for permanent blessings. Each blessing adds +3% to everything, forever. You have <b>${G.pts}</b> (+${G.pts*3}%).</small></span></div>
    <div class="gr"><span>${c>0?`Ascending now gives <b>+${c}</b> blessing${c>1?'s':''} (+${c*3}%).`:`Earn <b>${nf(Math.max(0,nextP-G.life))}</b> more Mon in total to earn your next blessing.`}</span><button class="btn bt ${c>0?'can':''}" data-asc="1" ${c>0?'':'disabled'}>Ascend</button></div>`+
    GIFTS.map((g,i)=>`<div class="gr${gift(i)?'':' lk'}"><b>${gift(i)?'贈':'鍵'}</b><span><strong>${g[1]}</strong> <small>(${g[0]} blessings)</small><br><small>${g[2]}</small></span></div>`).join('');
  }else{
    const t=(Date.now()-G.born)/3600000;
    p.innerHTML=`<div class="gr"><span><strong>Trophies ${Object.keys(G.ach).length}/${ACH.length}</strong> · each adds +1% to everything<br><small>Bell rings ${nf(G.clicks)} · lifetime ${nf(G.life)} Mon · this run ${nf(G.run)} · lucky koi ${G.koi} · ascensions ${G.asc} · playing for ${t<1?Math.round(t*60)+' minutes':t.toFixed(1)+' hours'}</small></span></div>`+
    ACH.map(a=>`<div class="gr${G.ach[a[0]]?'':' lk'}"><b>${a[1]}</b><span><strong>${a[2]}</strong><br><small>${a[3]}</small></span></div>`).join('');
  }
}
function draw(force){
  if(force)build();
  $('#mon').textContent=nf(G.mon)+' Mon';$('#mps').textContent=nf(mps())+' per second · bell '+nf(clickVal());
  const fz=Date.now()<G.fz?`Frenzy ×${G.fm} · ${Math.ceil((G.fz-Date.now())/1000)}s`:Date.now()<G.cf?`Bell frenzy ×50 · ${Math.ceil((G.cf-Date.now())/1000)}s`:'';
  $('#fz').textContent=fz;$('#info').innerHTML=`Blessings ${G.pts}<br>×${allMult().toFixed(2)} all`;
  if(tab=='gen')rows.forEach(d=>{
    const i=+d.dataset.i,g=GEN[i],n=amt(i),c=cost(i,n);
    d.querySelector('.own').textContent='×'+G.gens[i];
    const nm=MS.find(k=>G.gens[i]<k);d.querySelector('.rt').textContent=`${nf(g[3]*gmult(i)*allMult())}/s each${nm?' · ×2 at '+nm:''}`;
    const b=d.querySelector('.bt');d.querySelector('.ct').textContent=(n>1?'×'+n+' · ':'')+nf(c)+' Mon';b.classList.toggle('can',G.mon>=c);
    d.classList.toggle('lk',G.mon<g[2]*.5&&G.gens[i]==0);
  });
  else if(tab=='upg')rows.forEach(d=>d.querySelector('.bt').classList.toggle('can',G.mon>=UPG.find(u=>u.id==d.dataset.u).cost));
}
$('#bell').addEventListener('pointerdown',ring);
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));draw(true)};
$('#panel').onclick=e=>{
  const bb=e.target.closest('[data-b]');if(bb){buy=bb.dataset.b=='max'?'max':+bb.dataset.b;draw(true);return}
  const btn=e.target.closest('.bt');if(!btn)return;
  if(btn.dataset.asc){ui(`<div class="card"><h2>Ascend?</h2><p>You gain <b>+${claimable()}</b> blessing(s). Your Mon, attendants and upgrades reset. Blessings, trophies and gifts stay.</p><button class="btn go" data-a="doasc">Ascend</button><button class="btn" data-a="close">Not yet</button></div>`);return}
  const row=btn.closest('.gr');if(row.dataset.i!==undefined)buyGen(+row.dataset.i);else if(row.dataset.u)buyUpg(row.dataset.u);
};
setInterval(tick,100);
/* ---------- menu ---------- */
function menuHTML(){return `<p>Ring the bell and hire attendants to earn Mon. Catch the lucky koi that swims by. When you've earned enough, Ascend for permanent blessings. The shrine keeps earning while you're away.</p><div class="grid2"><button class="btn" data-a="export">Export save</button><button class="btn" data-a="import">Import save</button></div><button class="btn" data-a="reset">Hard reset</button>`}
function act(a){
  if(a=='doasc')ascend();
  else if(a=='export'){save();ui(`<div class="card"><h2>Export save</h2><p>Copy this text somewhere safe. Paste it into Import on any device.</p><textarea readonly id="sv">${pack()}</textarea><button class="btn" data-a="copy">Copy</button><button class="btn" data-a="menu">Back</button></div>`)}
  else if(a=='copy'){const t=$('#sv');t.select&&t.select();try{navigator.clipboard.writeText(t.value);toast('Copied')}catch(e){document.execCommand&&document.execCommand('copy')}}
  else if(a=='import')ui(`<div class="card"><h2>Import save</h2><p>Paste a save below. It replaces your current progress.</p><textarea id="sv"></textarea><button class="btn go" data-a="doimp">Load</button><button class="btn" data-a="menu">Back</button></div>`);
  else if(a=='doimp'){try{const o=unpack($('#sv').value);G=Object.assign(fresh(),o);G.gens=GEN.map((_,i)=>o.gens&&o.gens[i]||0);save();hideUi();draw(true);toast('Save loaded')}catch(e){toast('That does not look like a valid save')}}
  else if(a=='reset')ui(`<div class="card"><h2>Hard reset?</h2><p>This erases everything, including blessings and trophies.</p><button class="btn go" data-a="doreset">Erase everything</button><button class="btn" data-a="menu">Cancel</button></div>`);
  else if(a=='doreset'){G=fresh();save();hideUi();draw(true)}
  else if(a=='menu')openMenu();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
function boot(){load();lastT=Date.now();checkAch();draw(true);scheduleKoi();window.addEventListener('beforeunload',save)}

setTheme(document.documentElement.dataset.theme||'light');
if(typeof boot=='function')boot();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))</script>
</body>
</html>
