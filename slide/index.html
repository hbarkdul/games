<svg class="bg" aria-hidden="true"><defs><pattern id="sg" width="44" height="22" patternUnits="userSpaceOnUse"><g fill="var(--bg)" stroke="currentColor" stroke-width="1.2"><g id="sc"><circle cx="0" cy="11" r="22"/><circle cx="0" cy="11" r="16.5"/><circle cx="0" cy="11" r="11"/><circle cx="0" cy="11" r="5.5"/></g><use href="#sc" x="44"/><use href="#sc" x="22" y="11"/></g></pattern><pattern id="kb" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="20" height="60" fill="#d4112e"/><rect x="20" width="20" height="60" fill="#f2c200"/><rect x="40" width="20" height="60" fill="#151010"/></pattern><pattern id="ur" width="36" height="31" patternUnits="userSpaceOnUse"><path d="M0 31L18 0L36 31ZM-18 0L0 31M36 31L54 0" fill="none" stroke="currentColor" stroke-width="1.4"/></pattern><pattern id="rp" width="70" height="70" patternUnits="userSpaceOnUse"><g fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="20" cy="20" r="6"/><circle cx="20" cy="20" r="13"/><circle cx="20" cy="20" r="20"/><circle cx="52" cy="52" r="5"/><circle cx="52" cy="52" r="11"/></g></pattern><g id="kk" fill="none" stroke="currentColor" stroke-width="1.1"><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(0)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(30)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(60)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(90)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(120)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(150)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(180)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(210)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(240)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(270)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(300)"/><ellipse cy="-7" rx="2.2" ry="6" transform="rotate(330)"/></g><pattern id="ki" width="56" height="56" patternUnits="userSpaceOnUse"><use href="#kk" x="14" y="14"/><use href="#kk" transform="translate(42 42) sc <script>
function parse(s){
  var m={},vs=[];
  for(var i=0;i<36;i++){var c=s[i];if(c=='.')continue;
    if(!m[c]){m[c]={id:c,x:i%6,y:i/6|0,len:0,h:false};vs.push(m[c])}
    m[c].len++}
  vs.forEach(function(v){v.h=v.x<5&&s[v.y*6+v.x+1]==v.id;v.c=v.h?v.y:v.x;v.p0=v.h?v.x:v.y});
  vs.sort(function(a,b){return a.id=='R'?-1:b.id=='R'?1:0});
  return vs}
function cellAt(v,q){return v.h?v.c*6+q:q*6+v.c}
function grid(vs,pos){var g=Array(36).fill(-1);vs.forEach(function(v,i){for(var k=0;k<v.len;k++)g[cellAt(v,pos[i]+k)]=i});return g}
function solved(vs,pos){var g=grid(vs,pos);for(var x=pos[0]+vs[0].len;x<6;x++)if(g[12+x]!=-1)return false;return true}
function bfs(vs,start,cap){
  cap=cap||300000;
  if(solved(vs,start))return [];
  var seen=new Map([[start.join(''),null]]),q=[start];
  for(var h=0;h<q.length&&seen.size<cap;h++){
    var p=q[h],g=grid(vs,p),pk=p.join('');
    for(var i=0;i<vs.length;i++){var v=vs[i];
      for(var d=-1;d<=1;d+=2){
        for(var n=1;;n++){
          var np=p[i]+d*n,edge=d<0?np:np+v.len-1;
          if(edge<0||edge>5||g[cellAt(v,edge)]!=-1)break;
          var p2=p.slice();p2[i]=np;var k=p2.join('');
          if(seen.has(k))continue;
          seen.set(k,[pk,i,np]);
          if(solved(vs,p2)){var path=[],c=k;while(seen.get(c)){var e=seen.get(c);path.push([e[1],e[2]]);c=e[0]}return path.reverse()}
          q.push(p2);
        }
      }
    }
  }
  return null}

const LV=[".FDDL..F..LKIERRJKIECBJAIECB.A.HH.GG",".CE.JD.CEGJD.RRGFIHLLAFIH..A.....ABB","II.J..FF.JCC..RR.L.GKKDLBGEEDLBGAAHH","ECCAA.E.HH....RRI.....IDBBJJFDGGG.F.",".....D.GGGCD.RREC.FF.ECB.HHH.B.IIAAB","BIIH..B..H.DBRR.FDAE..FJAEGGFJ.E.CCC","DBFFAADB..CH.BRRCH..IGGG..IJJJ.EE...","BDDII.BEE.C.B.RRCAFFF.HA....H.GGG...","FFF.CCJABBB.JARRIL..EEILG..DILGKKDHH","BDDII.B...C.B.RRCAFFFEHA...EH.GGG...",".......GGGCB.RRECBFF.ECBDHHH..DIIAA.","ECCAA.EJJHHB..RRIBGGG.I.....F.DD..F.","CC.EE.ADD.I.A.RRIF.GG.IFKBBJJFK.HHLL","..GGHH...BCC.RRB.E.IIB.E...FFA.DDJJA","A.EEE.A.IFGGRRIF.H..IBBH.D.JJJ.DCCC.",".CGHHH.CG..F.IRRDF.IBBDF....A..EEEA.",".FDDLLIF.GGKIERRJKIE..JA.E..CAHHBBC.","A.EEEGAFF.DGRRI.DHB.I..HB.IJJJCCC...",".FFIII....DBCRR.DBCAA.DJ..HEEJGGH...",".IGGHH.I.BCC.RRB.E...B.E...FFADD.JJA","IFFGL.I.KGLCRRK..C.DEBBJ.DE..J.DHHAA","HH.FFDIII..D.GRRED.GABE...ABCC......","...DD....A.EHRRABEHFJAB..FJCCGII...G","DDCC..BB.G..HRRG.FH.AAAF..JIEELLJI..","L..EEEL.AKK.RRACFIG.ACFIG..HBJDDDHBJ","..JJAA..DEEIRRD..I..D...FGGCHBF..CHB","...ADD...A.EHRRABEHFJ.BG.FJCCGII....","KFAAA.KF.JJDHRRCIDH.BCIDH.BEE...BGGG","FDDDJ.F..GJ..RRGJAIBCC.AIB...AIBHHEE","FFIII.....D..RR.D.CBAAD.CBHEEJGGH..J","..JJ..HHDEEIRRD..I..D..BFGGC.BF..CAA","CC..DLAA..DL.KRRDLHKIGJJHEIGBB.E..FF","DDI.....IA.E.RRABE.FJABG.FJCCG..HH..","...CCCH..EK.HRREKFBBDEGF.ID.G..IAAA.","..DDD.F..GJAFRRGJAIBCCJAIB....IBHHEE","..III..JJFD..RRFD.CBAAD.CBHEE.GGH...","DDIAB.H.IABEHRRA.E.F...G.FJCCG..J...","B.DII.BED.CABERRCA....H.GGG.H.FFF...","..JIII..JFD..RRFD.CBAAD.CBHEE.GGH...",".FFFCC..BBBLGIRRJLGIEEJL.I.DAA.KKDHH","..JIII..JFD..RRFD..BAAD..BHEE.GGHCC.",".FFFCCA.BBBLAIRRJL.IEEJL.I.DGG.KKDHH","AFFFCCAIBBBL.IRRJL.IEEJL...DGG.KKDHH",".FFFCCAIBBBLAIRRJL.IEEJL...DGG.KKDHH","G.AAAHGII..HRRCB.HDDCB....CFFF..EEE.","G.AAAHG.II.HRRCB.HDDCB....CFFF..EEE.","GAAA.HGIIB.HRRCB.HDDC.....CFFF.EEE..","G.AAAHGIIB.HRRCB.HDDC.....CFFF.EEE.."],PAR=[2,3,4,4,5,5,6,6,7,7,8,8,9,9,10,10,11,11,12,12,13,13,14,14,15,15,16,16,17,17,18,18,19,19,20,20,21,21,22,22,23,23,24,24,27,27,28,28];
const $=s=>document.querySelector(s),B=$('#board');
const TH=[['light','Woodblock 浮世絵','#e6e0cf'],['dark','Neon ネオン','#0b0820'],['samurai','Samurai 侍','#0e0d0d'],['ninja','Ninja 忍','#090d0a'],['geisha','Geisha 芸者','#efd5d6'],['kabuki','Kabuki 歌舞伎','#f6e6b0'],['dragon','Dragon 龍','#1a0606'],['koi','Koi 鯉','#150e0a'],['imperial','Imperial 皇室','#ede6f5'],['kitsune','Kitsune 狐','#05061a']];
let VS,pos,hist,moves,cur=0,lock=false,cs=60,D=null,prog={};
try{prog=JSON.parse(localStorage.getItem('sd-p'))||{}}catch(e){}
try{cur=Math.min(LV.length-1,+localStorage.getItem('sd-c')||0)}catch(e){}
const save=()=>{try{localStorage.setItem('sd-p',JSON.stringify(prog));localStorage.setItem('sd-c',cur)}catch(e){}};
const stars=n=>'★'.repeat(n)+'☆'.repeat(3-n);

function fit(){
  const bs=Math.floor(Math.min(innerWidth-52,innerHeight-190,520)/6)*6;cs=bs/6;
  document.documentElement.style.setProperty('--bs',bs+'px');document.documentElement.style.setProperty('--cs',cs+'px');
}
function place(i,p,anim){
  const v=VS[i],e=B.children[i+1];
  e.style.left=((v.h?p:v.c)*cs+3)+'px';e.style.top=((v.h?v.c:p)*cs+3)+'px';
  e.style.width=((v.h?v.len:1)*cs-6)+'px';e.style.height=((v.h?1:v.len)*cs-6)+'px';
}
function layout(){fit();VS.forEach((v,i)=>place(i,pos[i]))}
function load(n){
  cur=n;VS=parse(LV[n]);pos=VS.map(v=>v.p0);hist=[];moves=0;lock=false;save();
  [...B.querySelectorAll('.blk')].forEach(e=>e.remove());
  VS.forEach((v,i)=>{const e=document.createElement('div');e.className='blk'+(i?'':' red');e.dataset.i=i;
    if(i){e.style.background=`var(--p${1+(v.id.charCodeAt(0)%5)})`}else e.textContent='殿';B.appendChild(e)});
  layout();hud();$('#ov').classList.remove('show');
}
function hud(){$('#hud').innerHTML=`Level ${cur+1} / ${LV.length}<br>Moves <b>${moves}</b> · Par ${PAR[cur]}`}
function toast(t){$('#toast').textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').textContent='',3500)}

B.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.blk');if(!b||lock)return;
  const i=+b.dataset.i,v=VS[i],g=grid(VS,pos);let lo=pos[i],hi=pos[i];
  while(lo>0&&g[cellAt(v,lo-1)]==-1)lo--;
  while(hi+v.len<6&&g[cellAt(v,hi+v.len)]==-1)hi++;
  D={i,b,lo,hi,st:v.h?e.clientX:e.clientY,p0:pos[i],c:pos[i]};b.setPointerCapture(e.pointerId);b.classList.add('drag');
  document.querySelectorAll('.hint').forEach(x=>x.classList.remove('hint'));
});
B.addEventListener('pointermove',e=>{
  if(!D)return;const v=VS[D.i];
  D.c=Math.max(D.lo,Math.min(D.hi,D.p0+((v.h?e.clientX:e.clientY)-D.st)/cs));place(D.i,D.c);
});
const up=()=>{
  if(!D)return;const d=D;D=null;d.b.classList.remove('drag');
  const np=Math.round(d.c);place(d.i,np);
  if(np!=pos[d.i]){hist.push(pos.slice());pos[d.i]=np;moves++;hud();if(solved(VS,pos))win()}
};
B.addEventListener('pointerup',up);B.addEventListener('pointercancel',up);

function win(){
  lock=true;const r=B.children[1];r.classList.add('out');r.style.left=(6.5*cs)+'px';
  const par=PAR[cur],s=moves<=par?3:moves<=Math.ceil(par*1.5)?2:1,o=prog[cur]||{s:0,m:999};
  prog[cur]={s:Math.max(o.s,s),m:Math.min(o.m,moves)};save();
  setTimeout(()=>{
    $('#ov').innerHTML=`<div class="card"><div class="big">脱</div><h2>Escaped!</h2><p style="font-size:26px;color:var(--accent)">${stars(s)}</p><p>${moves} moves · par ${par}</p>
    <div class="row"><button class="btn" data-a="list">Levels</button><button class="btn" data-a="again">Replay</button>${cur<LV.length-1?'<button class="btn" data-a="next">Next level →</button>':''}</div></div>`;
    $('#ov').classList.add('show');
  },900);
}
function levels(){
  $('#ov').innerHTML=`<div class="card"><h2>脱出 Levels</h2><select id="th" aria-label="Style" style="width:100%">${TH.map(t=>`<option value="${t[0]}"${document.documentElement.dataset.theme==t[0]?' selected':''}>${t[1]}</option>`).join('')}</select>
  <button class="btn" data-a="dys" style="width:100%;margin-top:8px">${dysLabel()}</button><p>Slide the blocks to clear a path for the red 殿 lord. Fewer moves, more stars.</p>
  <div class="lvls">${LV.map((_,i)=>`<button data-l="${i}" class="${i==cur?'cur':''}">${i+1}<small>${prog[i]?stars(prog[i].s):''}</small></button>`).join('')}</div>
  <div class="row"><button class="btn" data-a="close">Close</button></div></div>`;
  $('#ov').classList.add('show');
}
$('#ov').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
  if(b.dataset.l)load(+b.dataset.l);
  else if(a=='next')load(cur+1);else if(a=='again')load(cur);else if(a=='list')levels();else if(a=='close')$('#ov').classList.remove('show');else if(a=='dys'){toggleDys();levels()}
};
$('#ov').onchange=e=>{if(e.target.id=='th')setTheme(e.target.value)};
$('#bl').onclick=levels;$('#br').onclick=()=>load(cur);
$('#bu').onclick=()=>{if(lock||!hist.length)return;pos=hist.pop();moves--;VS.forEach((v,i)=>place(i,pos[i]));hud()};
$('#bh').onclick=()=>{
  if(lock)return;const p=bfs(VS,pos);if(!p||!p.length)return;
  const[i,np]=p[0],v=VS[i],d=np-pos[i];
  B.children[i+1].classList.add('hint');
  toast(`Slide the glowing block ${v.h?(d>0?'right':'left'):(d>0?'down':'up')} ${Math.abs(d)}`);
};
function toggleDys(){
  const on=!document.documentElement.hasAttribute('data-dys');
  document.documentElement.toggleAttribute('data-dys',on);
  try{localStorage.setItem('dys',on?'1':'0')}catch(e){}
  (document.fonts&&document.fonts.load('16px OpenDyslexic')||Promise.resolve()).catch(()=>{}).then(()=>setTheme(document.documentElement.dataset.theme));
}
const dysLabel=()=>'Dyslexia font: '+(document.documentElement.hasAttribute('data-dys')?'On':'Off');
function setTheme(t){
  document.documentElement.dataset.theme=t;try{localStorage.setItem('sd-t',t)}catch(e){}
  document.querySelector('meta[name=theme-color]').content=(TH.find(x=>x[0]==t)||TH[0])[2];
}
addEventListener('resize',()=>VS&&layout());
setTheme(document.documentElement.dataset.theme||'light');
load(cur);
</script>
</body>
</html>
