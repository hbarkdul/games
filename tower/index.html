<script>
const TITLE="禅庭 Zen Garden Defense",KEY="td";
const $=s=>document.querySelector(s);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const TH=[['light','Woodblock 浮世絵','#e6e0cf'],['dark','Neon ネオン','#0b0820'],['samurai','Samurai 侍','#0e0d0d'],['ninja','Ninja 忍','#090d0a'],['geisha','Geisha 芸者','#efd5d6'],['kabuki','Kabuki 歌舞伎','#f6e6b0'],['dragon','Dragon 龍','#1a0606'],['koi','Koi 鯉','#150e0a'],['imperial','Imperial 皇室','#ede6f5'],['kitsune','Kitsune 狐','#05061a']];
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.random()*n|0;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=t=>(t/60|0)+':'+String(t%60).padStart(2,'0');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function setTheme(t){
  document.documentElement.dataset.theme=t;put(KEY+'-t',t);
  document.querySelector('meta[name=theme-color]').content=(TH.find(x=>x[0]==t)||TH[0])[2];
  if(typeof onTheme=='function')onTheme();
}
function toggleDys(){
  const on=!document.documentElement.hasAttribute('data-dys');
  document.documentElement.toggleAttribute('data-dys',on);put('dys',on?'1':'0');
  (document.fonts&&document.fonts.load('16px OpenDyslexic')||Promise.resolve()).catch(()=>{}).then(()=>setTheme(document.documentElement.dataset.theme));
}
const dysLabel=()=>'Dyslexia font: '+(document.documentElement.hasAttribute('data-dys')?'On':'Off');
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),ms||2400)}
function ui(h){const o=$('#ov');o.innerHTML=h;o.classList.add('show')}
function hideUi(){$('#ov').classList.remove('show')}
function openMenu(){
  ui(`<div class="card"><h2>${TITLE}</h2>${typeof menuHTML=='function'?menuHTML():''}<select id="th" aria-label="Style">${TH.map(t=>`<option value="${t[0]}"${document.documentElement.dataset.theme==t[0]?' selected':''}>${t[1]}</option>`).join('')}</select><button class="btn" data-a="dys">${dysLabel()}</button><button class="btn" data-a="close">Close</button></div>`);
}
$('#ov').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(!a)return;
  if(a=='close')hideUi();else if(a=='dys'){toggleDys();openMenu()}else if(typeof act=='function')act(a,b);
};
$('#ov').onchange=e=>{if(e.target.id=='th')setTheme(e.target.value)};
$('#bm').onclick=openMenu;


const W=360,H=540,CS=30,COLS=12,ROWS=18,ST=3,WAVES=15;
const cv=$('#cv'),g=cv.getContext('2d');cv.width=W;cv.height=H;
const MAPS=[
 {n:'枯山水 Karesansui',p:[[-30,60],[90,60],[160,110],[110,175],[40,225],[110,290],[235,300],[300,355],[225,425],[120,445],[70,500],[70,580]],r:[[255,150,17],[305,235,14],[165,375,18],[55,345,13],[285,470,14],[200,200,12]]},
 {n:'苔庭 Moss garden',p:[[-30,490],[100,480],[190,430],[125,365],[205,305],[300,315],[330,235],[255,180],[150,205],[85,150],[125,85],[245,65],[390,65]],r:[[250,400,15],[60,400,14],[40,280,16],[300,120,13],[170,125,12],[230,260,12]]},
 {n:'池泉 Pond garden',p:[[180,-30],[180,80],[270,135],[265,215],[105,255],[100,340],[205,385],[285,445],[185,500],[185,580]],r:[[60,130,18],[310,320,15],[30,450,14],[130,170,13],[245,300,12]]}
];
const TW={
 fire:{k:'火',n:'Fire',cost:60,c:'accent',r:[90,95,100],cd:[1.1,.95,.8],dmg:[18,30,46],ar:[26,30,34],up:[50,90],d:'Fireballs that burst on impact'},
 ice:{k:'氷',n:'Ice',cost:70,c:'p1',r:[80,86,92],cd:[1.5,1.3,1.1],slow:[.45,.55,.62],dur:[2.2,2.6,3],frz:[1.2,1.6,2],n:[2,3,4],up:[55,95],d:'Slows enemies, freezes on every 3rd shot'},
 thorn:{k:'棘',n:'Thorn',cost:55,c:'p3',r:[95,100,110],cd:[2.2,1.8,1.5],dmg:[9,14,20],ch:[8,10,12],mx:[4,5,6],up:[45,80],d:'Lays spike traps on the path'},
 power:{k:'力',n:'Power',cost:90,c:'p2',r:[62,66,72],dm:[.25,.4,.6],rt:[.15,.25,.35],up:[70,110],d:'Boosts damage and speed of nearby towers'},
 warp:{k:'戻',n:'Return',cost:110,c:'p4',r:[100,110,120],cd:[10,8,6],up:[90,130],d:'Sends an enemy back to the start, then recharges'}
};
const EN={oni:{k:'鬼',hp:40,sp:38,rw:6},fast:{k:'速',hp:26,sp:68,rw:6},golem:{k:'岩',hp:150,sp:24,rw:14},boss:{k:'魔',hp:650,sp:22,rw:80,boss:1}};
let mi=+get('td-m')||0,unlocked=+get('td-u')||1,pts=[],ok=[],L=0,rocks=[],towers=[],enemies=[],shots=[],traps=[],fx=[],coins=150,lives=20,wave=0,running=false,queue=[],spT=0,spI=.9,hs=1,tNow=0,over=false,speed=1,auto=false,build=null,selT=null,pal={},uid=0,paused=false,last=0;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function buildPath(P){
  const dense=[];
  for(let i=0;i<P.length-1;i++){
    const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
    for(let k=0;k<16;k++){const t=k/16,t2=t*t,t3=t2*t,f=j=>.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3);dense.push([f(0),f(1)])}
  }
  dense.push(P[P.length-1]);
  const out=[dense[0]];let acc=0,prev=dense[0];
  for(let i=1;i<dense.length;i++){
    let a=prev;const b=dense[i];let d=Math.hypot(b[0]-a[0],b[1]-a[1]);
    while(acc+d>=ST){const f=(ST-acc)/d;a=[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];out.push(a);d=Math.hypot(b[0]-a[0],b[1]-a[1]);acc=0}
    acc+=d;prev=b;
  }
  return out;
}
function at(s){const f=Math.max(0,Math.min(pts.length-1.001,s/ST)),i=f|0,q=f-i,a=pts[i],b=pts[i+1];return[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]}
function loadMap(i){
  mi=i;put('td-m',i);const m=MAPS[i];pts=buildPath(m.p);L=(pts.length-1)*ST;rocks=m.r;
  ok=new Array(COLS*ROWS).fill(false);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=c*CS+CS/2,y=r*CS+CS/2;let good=true;
    for(let k=0;k<pts.length;k+=2)if(Math.hypot(pts[k][0]-x,pts[k][1]-y)<25){good=false;break}
    if(good)for(const q of rocks)if(Math.hypot(q[0]-x,q[1]-y)<q[2]+14){good=false;break}
    ok[r*COLS+c]=good;
  }
  towers=[];enemies=[];shots=[];traps=[];fx=[];coins=150;lives=20;wave=0;running=false;queue=[];over=false;build=null;selT=null;tNow=0;
  hideUi();hud();panel();palette();ctl();
}
function startWave(){
  if(running||over||wave>=WAVES)return;
  wave++;const w=wave,q=[];
  for(let i=0;i<5+2*w;i++)q.push('oni');
  if(w>=3)for(let i=0;i<w-1;i++)q.push('fast');
  if(w>=5)for(let i=0;i<Math.floor((w-2)/2);i++)q.push('golem');
  queue=shuf(q);if(w%5==0)queue.push('boss');
  spI=Math.max(.45,.95-.03*w);spT=0;hs=1+.2*w;running=true;hud();ctl();
}
function spawn(t){const d=EN[t];enemies.push({id:++uid,k:d.k,s:0,hp:d.hp*hs*(d.boss?1.4:1),mhp:d.hp*hs*(d.boss?1.4:1),sp:d.sp,rw:d.rw,boss:d.boss,x:pts[0][0],y:pts[0][1],slow:0,sa:0,frz:0})}
function act1(t,dt){
  const R=TW[t.k],lv=t.lv-1;t.cd-=dt*(1+t.rt);
  if(t.k=='power'||t.cd>0)return;
  const inr=enemies.filter(e=>e.hp>0&&dist(e,t)<=R.r[lv]).sort((a,b)=>b.s-a.s);
  if(!inr.length)return;
  if(t.k=='fire'){shots.push({x:t.x,y:t.y,e:inr[0],tx:inr[0].x,ty:inr[0].y,d:R.dmg[lv]*(1+t.dm),ar:R.ar[lv]});t.cd=R.cd[lv]}
  else if(t.k=='ice'){
    t.n++;
    inr.slice(0,R.n[lv]).forEach(e=>{e.slow=tNow+R.dur[lv];e.sa=Math.max(e.sa>0&&e.slow>tNow?e.sa:0,R.slow[lv]);e.hp-=3*(1+t.dm)});
    if(t.n%3==0)inr[0].frz=tNow+R.frz[lv];
    fx.push({k:'ring',x:t.x,y:t.y,r:R.r[lv],t:.35,c:'p1'});t.cd=R.cd[lv];
  }else if(t.k=='thorn'){
    if(traps.filter(x=>x.o===t).length>=R.mx[lv])return;
    const tg=inr[0];let q=at(Math.min(L-6,tg.s+18+rnd(34)));if(Math.hypot(q[0]-t.x,q[1]-t.y)>R.r[lv])q=at(tg.s);
    traps.push({x:q[0],y:q[1],ch:R.ch[lv],d:R.dmg[lv]*(1+t.dm),life:14,o:t,hit:{}});t.cd=R.cd[lv];
  }else if(t.k=='warp'){
    const c=inr.filter(e=>!e.boss&&e.s>60)[0];if(!c)return;
    fx.push({k:'beam',x:t.x,y:t.y,x2:c.x,y2:c.y,t:.45});c.s=0;c.slow=0;c.frz=tNow+.5;t.cd=R.cd[lv];
  }
}
function step(dt){
  tNow+=dt;
  if(queue.length){spT-=dt;if(spT<=0){spawn(queue.shift());spT=spI}}
  for(const t of towers)if(t.k!='power'){let dm=0,rt=0;for(const p of towers)if(p.k=='power'&&dist(p,t)<=TW.power.r[p.lv-1]){dm=Math.max(dm,TW.power.dm[p.lv-1]);rt=Math.max(rt,TW.power.rt[p.lv-1])}t.dm=dm;t.rt=rt}
  for(const e of enemies){const f=e.frz>tNow?0:(e.slow>tNow?1-e.sa:1);e.s+=e.sp*f*dt;const q=at(e.s);e.x=q[0];e.y=q[1];if(e.s>=L-1){e.leak=1}}
  for(const e of enemies)if(e.leak&&e.hp>0){lives-=e.boss?5:1;e.hp=0;e.gone=1}
  for(const t of towers)act1(t,dt);
  for(const s of shots){
    if(s.e.hp>0){s.tx=s.e.x;s.ty=s.e.y}
    const dx=s.tx-s.x,dy=s.ty-s.y,d=Math.hypot(dx,dy),mv=260*dt;
    if(d<=mv+4){s.hit=1;for(const e of enemies)if(e.hp>0&&Math.hypot(e.x-s.tx,e.y-s.ty)<=s.ar)e.hp-=s.d;fx.push({k:'ring',x:s.tx,y:s.ty,r:s.ar,t:.3,c:'accent'})}
    else{s.x+=dx/d*mv;s.y+=dy/d*mv}
  }
  shots=shots.filter(s=>!s.hit);
  for(const tr of traps){
    tr.life-=dt;
    for(const e of enemies)if(e.hp>0&&tr.ch>0&&Math.hypot(e.x-tr.x,e.y-tr.y)<14&&(tr.hit[e.id]||0)<=tNow){e.hp-=tr.d;tr.ch--;tr.hit[e.id]=tNow+.45;fx.push({k:'ring',x:e.x,y:e.y,r:8,t:.2,c:'p3'})}
  }
  traps=traps.filter(t=>t.ch>0&&t.life>0);
  fx.forEach(f=>f.t-=dt);fx=fx.filter(f=>f.t>0);
  enemies=enemies.filter(e=>{if(e.hp<=0){if(!e.gone)coins+=e.rw;return false}return true});
  if(running&&!queue.length&&!enemies.length){
    running=false;coins+=15+wave*3;
    if(wave>=WAVES)victory();else if(auto)startWave();
    hud();ctl();panel();
  }
  if(lives<=0&&!over)defeat();
}
function victory(){
  over=true;if(mi+1>=unlocked&&mi+1<MAPS.length){unlocked=mi+2;put('td-u',unlocked)}
  ui(`<div class="card"><h2>The garden is at peace</h2><p>${MAPS[mi].n} defended with ${lives} lives left.</p><button class="btn go" data-a="next">${mi+1<MAPS.length?'Next garden →':'Play again'}</button><button class="btn" data-a="menu">Menu</button></div>`);
}
function defeat(){over=true;ui(`<div class="card"><h2>The garden fell</h2><p>You held out to wave ${wave} of ${WAVES}.</p><button class="btn go" data-a="again">Try again</button><button class="btn" data-a="menu">Menu</button></div>`)}
const col=c=>pal[c]||pal.accent;
function strokePath(){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()}
function draw(){
  g.fillStyle=pal.bg;g.fillRect(0,0,W,H);
  g.strokeStyle=pal.wave;g.globalAlpha=.17;g.lineWidth=1.2;
  for(let y=8;y<H;y+=9){g.beginPath();for(let x=0;x<=W;x+=6){const wy=y+Math.sin(x*.05+y*.1)*1.5;x?g.lineTo(x,wy):g.moveTo(x,wy)}g.stroke()}
  g.globalAlpha=1;
  for(const[x,y,r]of rocks){g.fillStyle=pal.bg;g.beginPath();g.arc(x,y,r+33,0,7);g.fill();g.strokeStyle=pal.wave;g.globalAlpha=.32;g.lineWidth=1.3;for(let k=1;k<=3;k++){g.beginPath();g.arc(x,y,r+k*9,0,7);g.stroke()}g.globalAlpha=1}
  g.lineCap='round';g.lineJoin='round';g.strokeStyle=pal.face;g.globalAlpha=.26;g.lineWidth=30;strokePath();g.globalAlpha=.42;g.lineWidth=21;strokePath();g.globalAlpha=1;
  for(const[x,y,r]of rocks){g.fillStyle=pal.ink;g.globalAlpha=.55;g.beginPath();g.ellipse(x,y,r,r*.85,.3,0,7);g.fill();g.globalAlpha=.25;g.fillStyle=pal.face;g.beginPath();g.ellipse(x-r*.25,y-r*.3,r*.5,r*.35,.3,0,7);g.fill();g.globalAlpha=1}
  if(build){g.fillStyle=pal.p3;g.globalAlpha=.2;for(let i=0;i<ok.length;i++)if(ok[i]&&!towers.some(t=>t.c==i%COLS&&t.r==(i/COLS|0)))g.fillRect((i%COLS)*CS+2,(i/COLS|0)*CS+2,CS-4,CS-4);g.globalAlpha=1}
  for(const tr of traps){g.fillStyle=pal.p3;g.strokeStyle=pal.ink;g.lineWidth=1;g.globalAlpha=Math.min(1,tr.life/2);for(let k=0;k<3;k++){g.beginPath();const a=k*2.1+tr.x;g.moveTo(tr.x+Math.cos(a)*5,tr.y+Math.sin(a)*5-3);g.lineTo(tr.x+Math.cos(a+.4)*1,tr.y+Math.sin(a+.4)*1-9);g.lineTo(tr.x+Math.cos(a+.8)*5,tr.y+Math.sin(a+.8)*5-3);g.fill()}g.globalAlpha=1}
  if(selT){const R=TW[selT.k];g.strokeStyle=pal.accent;g.lineWidth=2;g.setLineDash([5,4]);g.beginPath();g.arc(selT.x,selT.y,R.r[selT.lv-1],0,7);g.stroke();g.setLineDash([])}
  for(const t of towers){
    const R=TW[t.k];g.fillStyle=col(R.c);g.beginPath();g.arc(t.x,t.y,13,0,7);g.fill();g.strokeStyle=t===selT?pal.accent:pal.edge;g.lineWidth=t===selT?3:2;g.stroke();
    g.fillStyle=pal.face;g.font='800 17px '+pal.disp;g.textAlign='center';g.textBaseline='middle';g.fillText(R.k,t.x,t.y+1);
    for(let i=0;i<t.lv;i++){g.beginPath();g.arc(t.x-4+i*4,t.y+18,1.7,0,7);g.fill()}
    if(t.k=='power'){g.strokeStyle=col(R.c);g.globalAlpha=.25;g.lineWidth=1.2;g.beginPath();g.arc(t.x,t.y,R.r[t.lv-1],0,7);g.stroke();g.globalAlpha=1}
    if(t.k=='warp'&&t.cd>0){g.strokeStyle=pal.face;g.lineWidth=2;g.beginPath();g.arc(t.x,t.y,16,-1.57,-1.57+6.28*(1-t.cd/TW.warp.cd[t.lv-1]));g.stroke()}
  }
  for(const e of enemies){
    const r=e.boss?13:9;g.fillStyle=pal.ink;g.beginPath();g.arc(e.x,e.y,r,0,7);g.fill();
    if(e.frz>tNow){g.strokeStyle=pal.p1;g.lineWidth=3;g.stroke()}else if(e.slow>tNow){g.strokeStyle=pal.p1;g.lineWidth=2;g.setLineDash([3,3]);g.stroke();g.setLineDash([])}
    g.fillStyle=pal.bg;g.font=`800 ${e.boss?16:12}px ${pal.disp}`;g.textAlign='center';g.textBaseline='middle';g.fillText(e.k,e.x,e.y+1);
    g.fillStyle=pal.ink;g.globalAlpha=.4;g.fillRect(e.x-r,e.y-r-6,r*2,3);g.globalAlpha=1;g.fillStyle=pal.accent;g.fillRect(e.x-r,e.y-r-6,r*2*Math.max(0,e.hp/e.mhp),3);
  }
  for(const s of shots){g.fillStyle=pal.accent;g.beginPath();g.arc(s.x,s.y,4,0,7);g.fill()}
  for(const f of fx){g.globalAlpha=Math.min(1,f.t*3);if(f.k=='ring'){g.strokeStyle=col(f.c);g.lineWidth=2;g.beginPath();g.arc(f.x,f.y,f.r*(1-f.t),0,7);g.stroke()}else{g.strokeStyle=pal.p4;g.lineWidth=3;g.beginPath();g.moveTo(f.x,f.y);g.lineTo(f.x2,f.y2);g.stroke()}g.globalAlpha=1}
}
function hud(){$('#info').innerHTML=`Wave ${wave}/${WAVES} · 命${lives}<br>金${Math.floor(coins)}`}
function ctl(){const w=$('#wave');w.disabled=running||over||wave>=WAVES;w.textContent=running?'Wave '+wave+' in progress':wave>=WAVES?'All waves done':'▶ Start wave '+(wave+1);$('#spd').textContent='Speed ×'+speed;$('#auto').textContent='Auto: '+(auto?'on':'off');$('#auto').classList.toggle('on',auto)}
function palette(){$('#tb').innerHTML=Object.keys(TW).map(k=>`<button class="btn tw${build==k?' on':''}" data-k="${k}"><b>${TW[k].k}</b><small>${TW[k].cost}</small></button>`).join('')}
function panel(){
  const p=$('#panel');
  if(selT){const t=selT,R=TW[t.k],up=t.lv<3?R.up[t.lv-1]:0;p.innerHTML=`<span><b>${R.k} ${R.n} · level ${t.lv}</b><br>${R.d}</span><div class="bar" style="margin-top:5px"><button class="btn go" data-p="up" ${!up||coins<up?'disabled':''}>${up?'Upgrade '+up+' 金':'Max level'}</button><button class="btn" data-p="sell">Sell +${Math.floor(t.spent*.7)} 金</button></div>`}
  else if(build){const R=TW[build];p.innerHTML=`<span><b>${R.k} ${R.n} · ${R.cost} 金</b><br>${R.d}. Tap a lit square to build.</span>`}
  else p.innerHTML='<span>Pick a tower below, then tap the garden. Tap a tower to upgrade or sell it.</span>';
}
$('#tb').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;build=build==k?null:k;selT=null;palette();panel()};
$('#panel').onclick=e=>{
  const b=e.target.closest('button');if(!b||!selT)return;const t=selT,R=TW[t.k];
  if(b.dataset.p=='up'&&t.lv<3&&coins>=R.up[t.lv-1]){coins-=R.up[t.lv-1];t.spent+=R.up[t.lv-1];t.lv++}
  else if(b.dataset.p=='sell'){coins+=Math.floor(t.spent*.7);towers=towers.filter(x=>x!==t);traps=traps.filter(x=>x.o!==t);selT=null}
  hud();panel();
};
cv.addEventListener('pointerdown',e=>{
  if(over)return;const q=cv.getBoundingClientRect(),x=(e.clientX-q.left)/q.width*W,y=(e.clientY-q.top)/q.height*H,c=x/CS|0,r=y/CS|0;
  const t=towers.find(t=>Math.hypot(t.x-x,t.y-y)<16);
  if(t){selT=t;build=null;palette();panel();return}
  if(build&&c>=0&&c<COLS&&r>=0&&r<ROWS&&ok[r*COLS+c]&&!towers.some(t=>t.c==c&&t.r==r)){
    const R=TW[build];
    if(coins>=R.cost){coins-=R.cost;towers.push({k:build,c,r,x:c*CS+CS/2,y:r*CS+CS/2,lv:1,cd:0,n:0,spent:R.cost,dm:0,rt:0});hud();panel()}else toast('Not enough 金');
  }else{selT=null;panel()}
});
$('#wave').onclick=startWave;
$('#spd').onclick=()=>{speed=speed%3+1;ctl()};
$('#auto').onclick=()=>{auto=!auto;ctl()};
function menuHTML(){return `<div class="grid2" style="grid-template-columns:1fr">${MAPS.map((m,i)=>`<button class="btn${i==mi?' on':''}" data-a="m${i}" ${i>=unlocked?'disabled':''}>${m.n}${i>=unlocked?' · 🔒 clear the previous garden':''}</button>`).join('')}</div><p>Survive ${WAVES} waves. Oni follow the path; towers can't be built on it or beside the rocks. 火 fire bursts, 氷 ice slows and freezes, 棘 thorns lay spikes, 力 power boosts nearby towers, 戻 return sends an enemy back to the start.</p><button class="btn go" data-a="again">Restart this garden</button>`}
function act(a){if(a=='again')loadMap(mi);else if(a=='next')loadMap(mi+1<MAPS.length?mi+1:0);else if(a=='menu')openMenu();else if(a[0]=='m')loadMap(+a[1])}
function onTheme(){const v=n=>css(n);pal={bg:v('--bg'),ink:v('--ink'),face:v('--face'),accent:v('--accent'),edge:v('--edge'),wave:v('--wave'),p1:v('--p1'),p2:v('--p2'),p3:v('--p3'),p4:v('--p4'),p5:v('--p5'),disp:v('--disp'),gl:+v('--gl')||0}}
function fit(){const w=Math.floor(Math.min(innerWidth-20,(innerHeight-310)*W/H,520));cv.style.width=w+'px';cv.style.height=(w*H/W)+'px'}
function frame(ts){
  requestAnimationFrame(frame);const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(!paused&&!over&&!$('#ov').classList.contains('show'))for(let k=0;k<speed;k++)step(dt);
  draw();
}
document.addEventListener('visibilitychange',()=>{paused=document.hidden});
addEventListener('resize',fit);
function boot(){fit();loadMap(Math.min(mi,unlocked-1));requestAnimationFrame(frame)}

setTheme(document.documentElement.dataset.theme||'light');
if(typeof boot=='function')boot();
</script>
